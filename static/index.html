<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanewatch — trade-lane risk, decided</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%23171717'/%3E%3Cpath d='M3 11.2h10M3 8h6.5M3 4.8h3.5' stroke='%23fff' stroke-width='1.7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Geist, self-hosted from static/fonts/ - the same faces the landing page is
   set in, so the two pages read as one product. No CDN: the page must load no
   external asset. */
@font-face{
  font-family:"Geist";
  src:url("/fonts/Geist-Variable.woff2") format("woff2-variations"),
      url("/fonts/Geist-Variable.woff2") format("woff2");
  font-weight:100 900; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"Geist Mono";
  src:url("/fonts/GeistMono-Variable.woff2") format("woff2-variations"),
      url("/fonts/GeistMono-Variable.woff2") format("woff2");
  font-weight:100 900; font-style:normal; font-display:swap;
}
/* ------------------------------------------------------------------
   Lanewatch, on the Geist design language: near-monochrome surfaces,
   hairline alpha borders, 6px radii, shadows you have to look for.
   Colour is spent only on state, never on decoration.
   ------------------------------------------------------------------ */
:root{
  --bg:#fafafa; --card:#fff; --card-muted:#fafafa; --sidebar:#fff;
  --fg:#171717; --muted:#4d4d4d; --faint:#8f8f8f;
  --border:#00000014; --border-strong:#00000024;
  --surface:#f2f2f2; --surface-2:#ebebeb;
  --blue:#006bff; --blue-bg:#e8f1ff;
  --green:#0f7b3f; --green-bg:#e7f5ec;
  --amber:#96580a; --amber-bg:#fdf3e3;
  --red:#ea001d;  --red-bg:#feecec;
  --r:6px;
  --shadow:0 2px 2px rgba(0,0,0,.04);
  --shadow-pop:0 1px 1px rgba(0,0,0,.02),0 4px 8px -4px rgba(0,0,0,.04),0 16px 24px -8px rgba(0,0,0,.06);
}
html[data-theme="dark"]{
  --bg:#000; --card:#0a0a0a; --card-muted:#111; --sidebar:#0a0a0a;
  --fg:#ededed; --muted:#a1a1a1; --faint:#7d7d7d;
  --border:#ffffff1f; --border-strong:#ffffff2e;
  --surface:#1a1a1a; --surface-2:#1f1f1f;
  --blue:#52a8ff; --blue-bg:#0d243f;
  --green:#3fcf68; --green-bg:#0d2618;
  --amber:#f5a623; --amber-bg:#2b1d05;
  --red:#ff5a5f;  --red-bg:#2d0d0f;
  --shadow:0 2px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 "Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit}
.shell{display:flex; height:100dvh; overflow:hidden}

/* ---------- sidebar ---------- */
.side{width:248px; flex:none; background:var(--sidebar); border-right:1px solid var(--border);
      display:flex; flex-direction:column}
.side-h{height:60px; display:flex; align-items:center; gap:10px; padding:0 16px}
.mark{width:26px;height:26px;border-radius:var(--r);background:var(--fg);flex:none;
      display:flex;align-items:center;justify-content:center}
.wordmark{font-size:15px;font-weight:600;letter-spacing:-.01em}
.tagline{font-size:11px;color:var(--faint);margin-top:-1px}
.nav{flex:1; overflow-y:auto; padding:6px 10px}
.nav-t{padding:12px 8px 5px; font-size:11px; font-weight:500; letter-spacing:.06em;
       text-transform:uppercase; color:var(--faint)}
.nav-i{display:flex; align-items:center; gap:9px; width:100%; text-align:left;
       padding:7px 8px; border:0; background:none; color:var(--muted);
       border-radius:var(--r); cursor:pointer; font-size:13.5px}
.nav-i:hover{background:var(--surface); color:var(--fg)}
.nav-i.on{background:var(--surface); color:var(--fg); font-weight:500}
.nav-i svg{flex:none; opacity:.75}
.nav-i .pill{margin-left:auto; font-size:11px; font-variant-numeric:tabular-nums;
             background:var(--fg); color:var(--card); border-radius:20px; padding:0 6px; font-weight:600}
.nav-i .pill.quiet{background:var(--surface-2); color:var(--muted)}
.side-f{border-top:1px solid var(--border); padding:11px 14px}
.side-f .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.side-f code{display:block; margin-top:3px; font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:11px; color:var(--fg); overflow-wrap:anywhere}
.side-f .sub{font-size:11px;color:var(--faint);margin-top:3px}

/* ---------- main ---------- */
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.top{height:60px; flex:none; display:flex; align-items:center; gap:12px;
     padding:0 22px; border-bottom:1px solid var(--border); background:var(--card)}
.crumb{font-size:14px; font-weight:500}
.crumb span{color:var(--faint); font-weight:400}
.top .right{margin-left:auto; display:flex; align-items:center; gap:8px}
.icon-btn{width:32px;height:32px;border-radius:var(--r);border:1px solid transparent;
          background:none;color:var(--faint);cursor:pointer;display:flex;
          align-items:center;justify-content:center}
.icon-btn:hover{background:var(--surface);color:var(--fg)}
.run{background:var(--fg);color:var(--card);border:0;border-radius:var(--r);
     padding:8px 14px;font-size:13.5px;font-weight:500;cursor:pointer;
     display:flex;align-items:center;gap:8px}
.run:hover:not(:disabled){opacity:.88}
.run:disabled{opacity:.6;cursor:default}
.spin{width:12px;height:12px;border:1.8px solid rgba(128,128,128,.4);
      border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.scroll{flex:1; overflow-y:auto; padding:22px}
.view{display:none} .view.on{display:block}
.wrap{max-width:1180px; margin:0 auto}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
      box-shadow:var(--shadow)}
.card-h{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;
        align-items:center;gap:9px}
.card-h h2{margin:0;font-size:13px;font-weight:600}
.card-h .n{margin-left:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.chip{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
      padding:2px 6px;border-radius:4px;background:var(--surface);color:var(--muted)}
.chip.live{background:var(--green-bg);color:var(--green)}
.chip.synth{background:var(--amber-bg);color:var(--amber)}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.red{background:var(--red-bg);color:var(--red)}
.sec-t{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
       color:var(--faint);margin:0 0 9px;display:flex;align-items:center;gap:8px}

/* stat row */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
      padding:14px 15px;box-shadow:var(--shadow)}
.stat .lab{font-size:12px;color:var(--faint)}
.stat .val{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:5px;
           font-variant-numeric:tabular-nums;line-height:1.1}
.stat .sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.stat.act .val{color:var(--amber)}

.grid2{display:grid;grid-template-columns:1fr 336px;gap:20px;align-items:start}
@media(max-width:1080px){.grid2{grid-template-columns:1fr}}

/* ---------- shipment rows ---------- */
.rows{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.row{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
     box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;padding:13px 15px;
     cursor:pointer;text-align:left;width:100%;border-left:2px solid var(--border-strong);
     transition:border-color .35s}
.row:hover{background:var(--card-muted);border-color:var(--border-strong)}
.row.green{border-left-color:var(--green)}
.row.rerouted{border-left-color:var(--blue)}
.row.hold{border-left-color:var(--amber)}
.row.idle{cursor:default}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
       padding:3px 8px;border-radius:4px;white-space:nowrap;flex:none;min-width:78px;text-align:center}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.rerouted{background:var(--blue-bg);color:var(--blue)}
.badge.hold{background:var(--amber-bg);color:var(--amber)}
.who{flex:1;min-width:0}
.who .id{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.who .cargo{font-weight:500;font-size:14px;margin:1px 0}
.who .lane{font-size:12.5px;color:var(--muted)}
.hl{font-size:12.5px;color:var(--muted);max-width:270px;text-align:right}
.eta{text-align:right;flex:none;min-width:104px}
.eta .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
.eta .val{font-size:13px;font-variant-numeric:tabular-nums;font-weight:500}
.eta .was{text-decoration:line-through;color:var(--faint);font-weight:400;margin-right:5px}
.eta .breach{color:var(--red);font-size:11px;font-weight:500}
.fb{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    background:var(--amber-bg);color:var(--amber);border-radius:4px;padding:2px 5px;margin-left:7px}

/* ---------- scenario switcher ---------- */
.scen{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.scen-b{border:1px solid var(--border);background:var(--card);color:var(--muted);
        border-radius:var(--r);padding:7px 12px;cursor:pointer;font-size:13px;
        display:flex;flex-direction:column;gap:1px;text-align:left;min-width:150px}
.scen-b:hover{border-color:var(--border-strong);color:var(--fg)}
.scen-b.on{border-color:var(--fg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.scen-b .k{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.scen-b .nm{font-weight:500}
.scen-note{font-size:12.5px;color:var(--muted);margin:-4px 0 16px}
.scen-note b{color:var(--fg)}

/* ---------- worker roster strip ---------- */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;margin-bottom:20px}
.wchip{border:1px solid var(--border);background:var(--card);border-radius:var(--r);
       padding:10px 12px;cursor:pointer;text-align:left;box-shadow:var(--shadow);
       display:flex;flex-direction:column;gap:5px}
.wchip:hover{border-color:var(--border-strong)}
.wchip.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.wchip .top{display:flex;align-items:center;gap:7px}
.wchip .nm{font-size:12.5px;font-weight:500;flex:1;min-width:0;overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap}
.wtag{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
      padding:1.5px 5px;border-radius:3px}
.wtag.live{background:var(--green-bg);color:var(--green)}
.wtag.scripted{background:var(--amber-bg);color:var(--amber)}
.wchip .st{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- worker panel band ---------- */
.wpanel{border:1px solid var(--border);background:var(--card);border-radius:var(--r);
        box-shadow:var(--shadow);margin-bottom:20px}
.wpanel-h{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;
          align-items:center;gap:9px;flex-wrap:wrap}
.wpanel-h b{font-size:13px}
.wpanel-b{padding:14px 15px}
.wpanel .ctx{font-size:12px;color:var(--faint);margin-left:auto}
table.q{width:100%;border-collapse:collapse;font-size:12.5px}
table.q th{text-align:left;font-weight:500;color:var(--faint);font-size:11px;
           text-transform:uppercase;letter-spacing:.05em;padding:0 10px 7px 0}
table.q td{padding:7px 10px 7px 0;border-top:1px solid var(--border);
           font-variant-numeric:tabular-nums}
table.q tr.pick td{background:var(--surface)}
.qtag{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
      padding:1.5px 5px;border-radius:3px;background:var(--blue-bg);color:var(--blue);margin-left:6px}
.qtag.cheap{background:var(--green-bg);color:var(--green)}
.ms{margin:0;padding:0 0 0 20px;list-style:none}
.ms li{position:relative;padding:6px 0;font-size:12.5px}
.ms li:before{content:"";position:absolute;left:-14px;top:12px;width:7px;height:7px;
              border-radius:50%;background:var(--border-strong)}
.ms li.done:before{background:var(--green)}
.ms li.dis:before{background:var(--amber)}
.ms li:after{content:"";position:absolute;left:-11px;top:19px;bottom:-6px;width:1px;background:var(--border)}
.ms li:last-child:after{display:none}
.ms .at{color:var(--faint);font-variant-numeric:tabular-nums;margin-left:8px;font-size:11.5px}
.fields{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:12.5px}
.fields .f{color:var(--faint)}
.qa{margin:0;padding:0;list-style:none}
.qa li{padding:9px 0;border-top:1px solid var(--border)}
.qa li:first-child{border-top:0;padding-top:0}
.qa .q{font-size:12.5px;font-weight:500}
.qa .a{font-size:12.5px;color:var(--muted);margin-top:3px}

/* ---------- workers ---------- */
.worker{padding:12px 15px;display:flex;gap:10px;align-items:flex-start}
.worker+.worker{border-top:1px solid var(--border)}
.wdot{width:7px;height:7px;border-radius:50%;background:var(--border-strong);flex:none;margin-top:6px}
.worker.working .wdot{background:var(--blue);animation:pulse 1s ease-in-out infinite}
.worker.done .wdot{background:var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.wname{font-size:13px;font-weight:500;display:flex;align-items:baseline;gap:7px}
.wsecs{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.wrole{font-size:11.5px;color:var(--faint);margin-top:2px;line-height:1.45}
.wsum{font-size:12.5px;margin-top:6px}
.wdet{margin:3px 0 0;padding:0;list-style:none}
.wdet li{font-size:11.5px;color:var(--muted);padding-left:9px;position:relative}
.wdet li:before{content:"·";position:absolute;left:1px}

/* ---------- risk feed ---------- */
.event{padding:13px 15px}
.event+.event{border-top:1px solid var(--border)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.tag{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
     padding:2px 6px;border-radius:4px;background:var(--surface);color:var(--muted)}
.tag.livesrc{background:var(--green-bg);color:var(--green)}
.tag.inj{background:var(--amber-bg);color:var(--amber)}
.tag.high{background:var(--red-bg);color:var(--red)}
.tag.lang{background:var(--blue-bg);color:var(--blue)}
.ev-title{font-size:13.5px;font-weight:500;line-height:1.45}
.ltrail{margin-top:9px;border-top:1px solid var(--border);padding-top:9px}
.ltrail-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);
          margin-bottom:6px}
.lt{display:flex;align-items:center;gap:8px;padding:2.5px 0;font-size:11.5px;color:var(--muted)}
.lt .lg{font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:1.5px 5px;border-radius:3px;
        background:var(--surface);color:var(--muted);min-width:26px;text-align:center}
.lt.first .lg{background:var(--blue-bg);color:var(--blue)}
.lt.wire .lg{background:var(--surface-2);color:var(--faint)}
.lt .off{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--faint);font-size:11px}
.lt .src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead{margin-top:7px;font-size:11.5px;color:var(--blue);font-weight:500}
.orig[dir="rtl"]{direction:rtl;text-align:right}
.orig{margin-top:6px;padding:7px 9px;background:var(--surface);border-radius:4px;
      font-size:12.5px;color:var(--muted);font-style:italic}
.ev-src{margin-top:7px;font-size:11.5px;color:var(--faint)}
.ev-why{margin-top:6px;font-size:12.5px;color:var(--muted)}
.srcline{padding:11px 15px;border-top:1px solid var(--border);font-size:11.5px;color:var(--faint)}
.srcline .r{display:flex;gap:7px;padding:1px 0}
.empty{padding:30px 16px;text-align:center;color:var(--faint);font-size:13px}

/* ---------- slide-over detail ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;
       transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:660px;max-width:94vw;background:var(--card);
       border-left:1px solid var(--border);box-shadow:var(--shadow-pop);z-index:50;
       transform:translateX(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);
       display:flex;flex-direction:column}
.panel.on{transform:none}
.panel-h{flex:none;padding:16px 20px;border-bottom:1px solid var(--border);
         display:flex;align-items:flex-start;gap:12px}
.panel-b{flex:1;overflow-y:auto;padding:20px}
.sec{margin-bottom:22px}
.sec:last-child{margin-bottom:0}
.reason{font-size:14px;line-height:1.62}
.rejected{margin:10px 0 0;padding:0;list-style:none}
.rejected li{font-size:12.5px;color:var(--muted);padding:4px 0 4px 15px;position:relative}
.rejected li:before{content:"×";position:absolute;left:0;color:var(--faint)}
.rejected b{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--fg)}
.record{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.record-h{background:var(--card-muted);padding:9px 13px;border-bottom:1px solid var(--border);
          font-size:11.5px;color:var(--faint);display:flex;gap:10px;flex-wrap:wrap}
.trail{margin:0;padding:12px 13px 13px 28px;list-style:none}
.trail li{position:relative;padding:5px 0;font-size:12.5px;color:var(--muted)}
.trail li:before{content:"";position:absolute;left:-17px;top:11px;width:6px;height:6px;
                 border-radius:50%;background:var(--border-strong)}
.trail li:after{content:"";position:absolute;left:-14.5px;top:18px;bottom:-5px;width:1px;
                background:var(--border)}
.trail li:last-child:after{display:none}
.trail li:last-child:before{background:var(--blue)}
.trail .k{color:var(--fg);font-weight:500}

/* ---------- drafts + approval ---------- */
.mail{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:10px}
.mail-h{background:var(--card-muted);padding:10px 13px;border-bottom:1px solid var(--border);font-size:12px}
.mail-h .to{font-weight:500}
.mail-h .subj{color:var(--muted);margin-top:2px}
.mail-b{padding:13px;font-size:12.5px;line-height:1.65;white-space:pre-wrap;
        font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;max-height:300px;overflow:auto}
.gate{display:flex;align-items:center;gap:10px;padding:10px 13px;border-top:1px solid var(--border);
      background:var(--card-muted);flex-wrap:wrap}
.gate-s{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
        padding:3px 8px;border-radius:4px}
.gate-s.awaiting{background:var(--amber-bg);color:var(--amber)}
.gate-s.approved{background:var(--green-bg);color:var(--green)}
.approve{background:var(--fg);color:var(--card);border:0;border-radius:var(--r);
         padding:6px 13px;font-size:12.5px;font-weight:500;cursor:pointer}
.approve:hover{opacity:.88}
.gate .never{margin-left:auto;font-size:11px;color:var(--faint)}
.warn{margin-top:9px;font-size:12px;color:var(--amber);background:var(--amber-bg);
      border-radius:4px;padding:7px 10px}
.note{background:var(--amber-bg);border:1px solid var(--border);color:var(--amber);
      border-radius:var(--r);padding:10px 13px;font-size:12.5px;margin-bottom:8px}
.hint{border:1px dashed var(--border-strong);border-radius:var(--r);padding:14px 16px;
      font-size:13px;color:var(--muted);background:var(--card)}
.hint b{color:var(--fg)}
.keys{display:flex;gap:20px;flex-wrap:wrap}
.key{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--muted)}
.sw{width:10px;height:10px;border-radius:3px;flex:none;margin-top:3px}
.sw.live{background:var(--green-bg);border:1.5px solid var(--green)}
.sw.synth{background:var(--amber-bg);border:1.5px solid var(--amber)}
.sw.draft{background:var(--surface);border:1.5px dashed var(--border-strong)}
.key b{color:var(--fg);font-weight:600}
.said{margin-top:11px;padding-top:11px;border-top:1px solid var(--border);
      font-size:13px;font-style:italic}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="side-h" href="/" title="Back to the Lanewatch overview page"
       style="text-decoration:none;color:inherit">
      <div class="mark"><svg width="15" height="15" viewBox="0 0 20 20" fill="none">
        <path d="M3.2 14h13.6M3.2 10h8.6M3.2 6h4.6" stroke="var(--card)" stroke-width="2.1" stroke-linecap="round"/></svg></div>
      <div><div class="wordmark">Lanewatch</div><div class="tagline">Trade-lane risk, decided</div></div>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="side-f">
      <span class="lab">Decision engine</span>
      <code id="eng-model">not yet resolved</code>
      <div class="sub" id="eng-split">resolves on the first run</div>
    </div>
  </aside>

  <div class="main">
    <div class="top">
      <div class="crumb"><span>Lanewatch</span> / <span id="crumb">Overview</span></div>
      <div class="right">
        <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme"></button>
        <button class="run" id="run"><span id="run-t">Inject Hamburg strike</span></button>
      </div>
    </div>
    <div class="scroll" id="scroll">
      <div class="wrap">
        <div id="band"></div>
        <div class="view on" id="v-overview"></div>
        <div class="view" id="v-shipments"></div>
        <div class="view" id="v-risk"></div>
        <div class="view" id="v-approvals"></div>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel"><div class="panel-h" id="panel-h"></div><div class="panel-b" id="panel-b"></div></aside>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LABEL = {green:"On plan", rerouted:"Rerouted", hold:"Hold"};
const ICON = {
  workers:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M2 19c0-2.8 2.2-5 5-5M12 19c0-2.8 2.2-5 5-5s5 2.2 5 5"/></svg>',
  overview:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  shipments:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7h13v10H3zM16 10h3l2 3v4h-5"/><circle cx="7" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>',
  risk:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l9 16H3z"/><path d="M12 9v4M12 16.5v.5"/></svg>',
  approvals:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16v11H4z"/><path d="M4 6l8 6 8-6"/></svg>',
  sun:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z"/></svg>',
  close:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};

let board=[], workers=[], risk={events:[],sources:[]}, ai=null, summary=null, notes=[], hasRun=false;
let scenarios=[], scenario=null, chosenScenario=null, openWorker=null, selected=null;
const approved = new Set();     // approval is browser state only; nothing is transmitted
let view = "overview", openId = null;

/* ---------- theme ---------- */
function theme(next){
  const t = next || localStorage.getItem("lw:theme") || "light";
  document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem("lw:theme", t); }catch(e){}
  $("theme").innerHTML = t === "dark" ? ICON.sun : ICON.moon;
}
$("theme").onclick = () => theme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");

/* ---------- nav ---------- */
function pending(){ return board.flatMap(s=>s.drafts||[]).filter(d=>!approved.has(key(d))).length; }
function key(d){ return `${d.shipment_id}|${d.audience}`; }
function attention(){ return board.filter(s=>s.state!=="green" && s.decision).length; }

function renderNav(){
  const items = [
    {id:"overview",  label:"Overview",  n:null},
    {id:"shipments", label:"Shipments", n:board.length, quiet:true},
    {id:"risk",      label:"Risk feed", n:(risk.events||[]).length, quiet:true},
    {id:"approvals", label:"Approvals", n:pending()},
  ];
  $("nav").innerHTML = `<div class="nav-t">Operations</div>` + items.map(i => `
    <button class="nav-i ${view===i.id?"on":""}" data-view="${i.id}">
      ${ICON[i.id]}<span>${i.label}</span>
      ${i.n ? `<span class="pill ${i.quiet?"quiet":""}">${i.n}</span>` : ""}
    </button>`).join("");
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
}
function go(id){
  view = id;
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  $("v-"+id).classList.add("on");
  $("crumb").textContent = {overview:"Overview",shipments:"Shipments",risk:"Risk feed",approvals:"Approvals"}[id];
  $("scroll").scrollTop = 0;
  render();
}

/* ---------- pieces ---------- */
function statRow(){
  if (!hasRun) return "";
  const s = summary || {};
  const late = board.filter(b => b.decision && b.decision.deadline_breached).length;
  return `<div class="stats">
    <div class="stat"><div class="lab">Shipments tracked</div><div class="val">${board.length}</div>
      <div class="sub">${s["no-action"]||0} on plan, ${attention()} actioned</div></div>
    <div class="stat"><div class="lab">Risk events</div><div class="val">${(risk.events||[]).length}</div>
      <div class="sub">${(risk.sources||[]).filter(x=>x.status==="ok").length} of ${(risk.sources||[]).length} sources read</div></div>
    <div class="stat ${late?"act":""}"><div class="lab">Deadlines at risk</div><div class="val">${late}</div>
      <div class="sub">${late?"customer date missed":"all within required-by"}</div></div>
    <div class="stat ${pending()?"act":""}"><div class="lab">Awaiting your approval</div><div class="val">${pending()}</div>
      <div class="sub">${pending()?"drafts need a human":"all drafts approved"}</div></div>
  </div>`;
}

function rowHTML(s){
  const d=s.decision, idle=!d;
  const eta = d && d.delay_days
    ? `<span class="was">${esc(d.original_eta)}</span>${esc(d.revised_eta)}` : esc(s.eta);
  return `<button class="row ${s.state} ${idle?"idle":""}" data-open="${esc(s.id)}" ${idle?"disabled":""}>
    <span class="badge ${s.state}">${LABEL[s.state]}</span>
    <span class="who">
      <span class="id">${esc(s.id)}${s.cold_chain?" · cold chain":""}</span>
      <div class="cargo">${esc(s.cargo)}</div>
      <div class="lane">${esc(s.origin)} → ${esc(s.final_destination)}</div>
    </span>
    ${d?`<span class="hl">${esc(d.headline)}${d.fallback?`<span class="fb">rule</span>`:""}</span>`:""}
    <span class="eta"><span class="lab">${d&&d.delay_days?"Revised ETA":"ETA"}</span>
      <div class="val">${eta}</div>
      ${d&&d.deadline_breached?`<div class="breach">misses ${esc(d.required_by)}</div>`:""}</span>
  </button>`;
}

function shipmentGroups(){
  const act = board.filter(s=>s.state!=="green"), ok = board.filter(s=>s.state==="green");
  // The board is authored data and must say so wherever it appears, not only
  // in the legend - the provenance labels are the honest half of the demo.
  const head = t => `<p class="sec-t">${t} <span class="chip synth">synthetic</span></p>`;
  if (!hasRun) return head("In transit") + `<div class="rows">${board.map(rowHTML).join("")}</div>`;
  return (act.length? head(`Needs a decision — ${act.length}`) +
      `<div class="rows">${act.map(rowHTML).join("")}</div>`:"") +
    (ok.length? head(`On plan — ${ok.length}`) +
      `<div class="rows">${ok.map(rowHTML).join("")}</div>`:"");
}

function scenarioSwitcher(){
  if (!scenarios.length) return "";
  const active = (scenario||{}).id || chosenScenario || (scenarios[0]||{}).id;
  const sc = scenarios.find(x=>x.id===active) || scenarios[0];
  return `<p class="sec-t">Scenario <span class="chip synth">scripted</span></p>
    <div class="scen">${scenarios.map(x=>`
      <button class="scen-b ${x.id===active?"on":""}" data-scen="${esc(x.id)}">
        <span class="k">${esc(x.kind)}</span><span class="nm">${esc(x.name)}</span>
      </button>`).join("")}</div>
    <p class="scen-note"><b>${esc(sc.decision_type)}.</b> ${esc(sc.summary)}</p>`;
}

function rosterStrip(){
  if (!workers.length) return "";
  return `<p class="sec-t">Workers</p><div class="roster">${workers.map(w=>{
    const mode = w.mode==="live" ? "live" : "scripted";
    return `<button class="wchip ${openWorker===w.id?"on":""}" data-worker="${esc(w.id)}">
      <span class="top"><span class="wdot" style="margin:0"></span>
        <span class="nm">${esc(w.name)}</span>
        <span class="wtag ${mode}">${mode}</span></span>
      <span class="st">${esc(w.summary || w.role)}</span></button>`;}).join("")}</div>`;
}

function workerPanel(){
  if (!openWorker) return "";
  const w = workers.find(x=>x.id===openWorker); if (!w) return "";
  const ship = board.find(x=>x.id===selected) || board.find(x=>x.state!=="green") || board[0];
  const mode = w.mode==="live" ? "live" : "scripted";
  const ctx = `${ship?esc(ship.id):"no shipment"}${scenario?` · ${esc(scenario.name)}`:""}`;
  let body;
  if (mode === "live")      body = livePanelBody(w, ship);
  else if (!hasRun)         body = `<div class="empty">Run a scenario to populate this Worker.</div>`;
  else                      body = scriptedPanelBody(w, ship);
  return `<div class="wpanel"><div class="wpanel-h">
      <b>${esc(w.name)}</b><span class="wtag ${mode}">${mode}</span>
      <span class="ctx">${ctx}</span></div>
    <div class="wpanel-b">${body}</div></div>`;
}

function livePanelBody(w, ship){
  if (w.id === "risk") return riskCard(false);
  if (!ship || !ship.decision) return `<div class="empty">Run a scenario to populate this Worker.</div>`;
  const d = ship.decision;
  if (w.id === "routing")
    return `<div class="reason">${esc(d.reasoning)}</div>
      <div class="record" style="margin-top:12px"><div class="record-h">
        <span>${esc(ship.id)}</span><span>decided by ${esc(d.decided_by)}</span>
        <span>confidence ${esc(d.confidence)}</span></div>
      <ul class="trail">${(d.reasoning_trail||[]).map(t=>
        `<li><span class="k">${esc(t.check)}</span> — ${esc(t.finding)}</li>`).join("")}</ul></div>`;
  return (ship.drafts||[]).length ? ship.drafts.map(mailHTML).join("")
    : `<div class="empty">Nothing to draft — this shipment needs no action.</div>`;
}

function scriptedPanelBody(w, ship){
  const p = ((ship||{}).roster||{})[w.id];
  if (!p) return `<div class="empty">No scripted data for this selection.</div>`;
  if (w.id === "rate")
    return `<p class="sec-t">${esc(p.headline)}</p>
      ${p.surcharge_note?`<div class="warn" style="margin:0 0 10px">${esc(p.surcharge_note)}</div>`:""}
      <table class="q"><thead><tr><th>Carrier</th><th>Routing</th><th>Discharge</th>
        <th>Transit</th><th>Cost index</th></tr></thead><tbody>
        ${p.quotes.map(q=>`<tr class="${q.chosen?"pick":""}">
          <td>${esc(q.carrier)}</td><td>${esc(q.route_id)}</td><td>${esc(q.discharge_port)}</td>
          <td>${esc(q.transit_days)}d</td>
          <td>${esc(q.cost_index)}${q.cheapest?`<span class="qtag cheap">cheapest</span>`:""}${
            q.chosen?`<span class="qtag">booked</span>`:""}</td></tr>`).join("")}
      </tbody></table>`;
  if (w.id === "milestones")
    return `<p class="sec-t">${esc(p.headline)}</p><ul class="ms">${p.milestones.map(m=>
      `<li class="${m.done?"done":""} ${m.disruption?"dis":""}">${esc(m.label)}
        <span class="at">${esc(m.at)}</span></li>`).join("")}</ul>`;
  if (w.id === "docs")
    return `<p class="sec-t">${esc(p.headline)}</p>
      <div class="fields">${p.fields.map(f=>
        `<span class="f">${esc(f.field)}</span><span>${esc(f.value)}</span>`).join("")}</div>
      ${p.flag?`<div class="warn">${esc(p.flag)}</div>`:""}`;
  return `<p class="sec-t">${esc(p.headline)}</p><ul class="qa">${p.qa.map(x=>
    `<li><div class="q">${esc(x.q)}</div><div class="a">${esc(x.a)}</div></li>`).join("")}</ul>`;
}

function workersCard(){
  return `<div class="card" style="margin-bottom:20px">
    <div class="card-h"><h2>Workers</h2><span class="n">3</span></div>
    ${workers.map(w=>`<div class="worker ${w.status}"><span class="wdot"></span>
      <div style="flex:1;min-width:0">
        <div class="wname">${esc(w.name)}${w.seconds!=null?`<span class="wsecs">${esc(w.seconds)}s</span>`:""}</div>
        <div class="wrole">${esc(w.role)}</div>
        ${w.summary?`<div class="wsum">${esc(w.summary)}</div>`:""}
        ${(w.detail||[]).length?`<ul class="wdet">${w.detail.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>`:""}
      </div></div>`).join("")}</div>`;
}

function riskCard(compact){
  const ev = risk.events||[], srcs = risk.sources||[];
  const ok = srcs.filter(s=>s.status==="ok").length;
  const bad = srcs.filter(s=>s.status==="failed");
  return `<div class="card">
    <div class="card-h"><h2>Risk feed</h2><span class="chip live">live</span><span class="n">${ev.length}</span></div>
    ${ev.length ? ev.map(e=>`<div class="event">
      <div class="tags">
        <span class="tag ${e.origin==="injected"?"inj":"livesrc"}">${e.origin==="injected"?"scripted":"live"}</span>
        <span class="tag ${esc(e.severity)}">${esc(e.severity)}</span>
        <span class="tag">${esc(e.chokepoint)} ${esc(e.type)}</span>
        <span class="tag lang">${esc((e.source_language||"").toUpperCase())}</span>
      </div>
      <div class="ev-title">${esc(e.title)}</div>
      ${e.title_original?`<div class="orig" dir="${RTL.has(e.source_language)?"rtl":"ltr"}"
        lang="${esc(e.source_language)}">${esc(e.title_original)}</div>`:""}
      <div class="ev-src">${esc(e.detected_first_from||e.source)}</div>
      ${!compact && e.reasoning?`<div class="ev-why">${esc(e.reasoning)}</div>`:""}
      ${languageTrail(e, compact)}
    </div>`).join("") : `<div class="empty">No active events.<br>Press <b>Inject Hamburg strike</b> to start.</div>`}
    ${srcs.length?`<div class="srcline">
      <div class="r">✓ ${ok} of ${srcs.length} sources read</div>
      ${bad.length?`<div class="r">! unavailable: ${esc(bad.slice(0,4).map(s=>s.name.replace(/^(RSS|GDELT|PEGELONLINE): /,"")).join(", "))}${bad.length>4?` +${bad.length-4} more`:""}</div>`:""}
    </div>`:""}</div>`;
}

const RTL = new Set(["ar","he","fa","ur"]);
const LANGNAME = {de:"German", ar:"Arabic", fr:"French", nl:"Dutch", es:"Spanish", en:"English"};

function offsetLabel(mins){
  if (!mins) return "first";
  if (mins < 90) return `+${mins}m`;
  const h = Math.round(mins/60);
  return h < 48 ? `+${h}h` : `+${Math.round(h/24)}d`;
}

/* The earliness claim, shown rather than asserted: which languages carried the
   story, in what order, and how far behind the English wires were. */
function languageTrail(e, compact){
  const trail = e.language_trail || [];
  if (trail.length < 2) return "";
  const first = trail.find(t=>t.first) || trail[0];
  const wire  = trail.find(t=>t.english_wire);
  const lead  = wire && !wire.first
    ? `Seen in ${LANGNAME[first.language]||first.language} ${offsetLabel(wire.offset_minutes).replace("+","")} before the English wires`
    : null;
  if (compact) {
    return `<div class="ltrail"><div class="ltrail-h">Carried in ${
      (e.languages||[]).length} languages</div>
      <div class="lt first"><span class="lg">${esc(first.language.toUpperCase())}</span>
        <span class="src">${esc(first.source)}</span><span class="off">first</span></div>
      ${lead?`<div class="lead">${esc(lead)}</div>`:""}</div>`;
  }
  return `<div class="ltrail"><div class="ltrail-h">Detection trail — ${
    (e.languages||[]).length} languages</div>
    ${trail.map(t=>`<div class="lt ${t.first?"first":""} ${t.english_wire&&!t.first?"wire":""}">
      <span class="lg">${esc(t.language.toUpperCase())}</span>
      <span class="src">${esc(t.source)}</span>
      <span class="off">${esc(offsetLabel(t.offset_minutes))}</span></div>`).join("")}
    ${lead?`<div class="lead">${esc(lead)}</div>`:""}</div>`;
}

function legendCard(){
  return `<div class="card" style="padding:14px 16px;margin-bottom:20px">
    <div class="keys">
      <span class="key"><i class="sw live"></i><span><b>Live</b> — the risk feed. Real news, pulled now, in several languages.</span></span>
      <span class="key"><i class="sw synth"></i><span><b>Synthetic</b> — the five shipments and the injected strike.</span></span>
      <span class="key"><i class="sw draft"></i><span><b>Drafted, never sent</b> — approval changes state only.</span></span>
    </div>
    <div class="said">“The risk detection is real — it runs against live news right now. The shipments are
      synthetic, so I can show you a disruption on demand instead of waiting for one.”</div></div>`;
}

/* ---------- views ---------- */
function render(){
  $("band").innerHTML = scenarioSwitcher() + rosterStrip() + workerPanel();
  // Only the visible view is built. Rendering all four left duplicate rows and
  // duplicate handlers in the DOM, with the hidden copies first.
  ["overview","shipments","risk","approvals"].forEach(v => {
    if (v !== view) $("v-"+v).innerHTML = "";
  });

  if (view === "overview") $("v-overview").innerHTML = legendCard() + statRow() +
    (hasRun?"":`<div class="hint" style="margin-bottom:20px">
      <b>Nothing has happened yet.</b> Press <b>Inject Hamburg strike</b> above — the Workers read live news,
      triage all ${board.length} shipments, and draft the emails each one needs. Everything then
      waits for your approval.</div>`) +
    notes.map(n=>`<div class="note">${esc(n)}</div>`).join("") +
    `<div class="grid2"><div>${shipmentGroups()}</div><div>${workersCard()}${riskCard(true)}</div></div>`;

  if (view === "shipments") $("v-shipments").innerHTML = statRow() + shipmentGroups();
  if (view === "risk")      $("v-risk").innerHTML = riskCard(false);
  if (view === "approvals") $("v-approvals").innerHTML = approvalsView();

  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    selected = b.dataset.open;
    // With a Worker panel open, picking a shipment drives that panel instead of
    // opening the detail drawer - that reactivity is the point of the roster.
    if (openWorker) render(); else openPanel(b.dataset.open);
  });
  document.querySelectorAll("[data-scen]").forEach(b => b.onclick = () => {
    chosenScenario = b.dataset.scen; render(); run();
  });
  document.querySelectorAll("[data-worker]").forEach(b => b.onclick = () => {
    openWorker = openWorker === b.dataset.worker ? null : b.dataset.worker;
    render();
  });
  bindApprove();
  renderNav();
}

function approvalsView(){
  const withDrafts = board.filter(s=>(s.drafts||[]).length);
  if (!withDrafts.length) return `<div class="hint">No drafts yet. Run a cycle — any shipment that
    needs action gets a carrier and a customer email, and both wait here for you.</div>`;
  const left = pending();
  return `<p class="sec-t">${left?`${left} awaiting your approval`:"All approved"} · nothing is ever sent</p>` +
    withDrafts.map(s=>`<div style="margin-bottom:22px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:2px">
        <span class="badge ${s.state}">${LABEL[s.state]}</span>
        <b style="font-size:14px">${esc(s.id)} · ${esc(s.cargo)}</b>
        <span style="font-size:12.5px;color:var(--muted)">${esc(s.customer||"")}</span>
      </div>
      ${s.drafts.map(m=>mailHTML(m)).join("")}</div>`).join("");
}

function mailHTML(m){
  const k = key(m), ok = approved.has(k);
  return `<div class="mail">
    <div class="mail-h"><div class="to">To the ${esc(m.audience)}: ${esc(m.to)}${
      m.fallback?`<span class="fb" title="${esc(m.fallback_reason||"")}">template</span>`:""}</div>
      <div class="subj">${esc(m.subject)}</div>
      ${m.fallback&&m.fallback_reason?`<div class="subj" style="color:var(--amber)">model unavailable: ${esc(m.fallback_reason)}</div>`:""}</div>
    <div class="mail-b">${esc(m.body)}</div>
    <div class="gate">
      <span class="gate-s ${ok?"approved":"awaiting"}">${ok?"Approved — ready to send":"Awaiting approval"}</span>
      ${ok?"":`<button class="approve" data-approve="${esc(k)}">Approve</button>`}
      <span class="never">nothing is transmitted — approval is a state change</span>
    </div></div>` +
    (m.warnings||[]).map(w=>`<div class="warn">Fix before sending: ${esc(w)}</div>`).join("");
}

function bindApprove(){
  document.querySelectorAll("[data-approve]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    approved.add(b.dataset.approve);   // state change only; nothing is sent
    render(); if (openId) openPanel(openId, true);
  });
}

/* ---------- slide-over ---------- */
function openPanel(id, keep){
  const s = board.find(x=>x.id===id); if (!s || !s.decision) return;
  openId = id;
  const d = s.decision;
  $("panel-h").innerHTML = `<div style="flex:1">
      <div style="display:flex;align-items:center;gap:9px">
        <span class="badge ${s.state}">${LABEL[s.state]}</span>
        <b style="font-size:15px">${esc(s.id)} · ${esc(s.cargo)}</b></div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:4px">
        ${esc(s.origin)} → ${esc(s.final_destination)} · ${esc(s.customer||"")}</div></div>
    <button class="icon-btn" id="panel-x">${ICON.close}</button>`;
  $("panel-b").innerHTML =
    `<div class="sec"><p class="sec-t">Why</p><div class="reason">${esc(d.reasoning)}</div>
      ${(d.rejected_options||[]).length?`<ul class="rejected">${d.rejected_options.map(o=>
        `<li><b>${esc(o.route_id)}</b> — ${esc(o.why_not)}</li>`).join("")}</ul>`:""}</div>` +
    (d.decision==="reroute"?`<div class="sec"><p class="sec-t">Routing change</p>
      <div class="reason">${esc(d.route_before)} → <b>${esc(d.recommended_route)}</b><br>
      <span style="color:var(--muted);font-size:13px">${esc(d.recommended_route_description||"")} ·
      discharge ${esc(d.recommended_discharge_port||"")} · then ${esc(d.recommended_inland_leg||"")}</span>
      </div></div>`:"") +
    `<div class="sec"><p class="sec-t">Decision record · ${esc((d.decided_at||"").replace("T"," ").replace("+00:00"," UTC"))}</p>
      <div class="record"><div class="record-h">
        <span>decided by ${esc(d.decided_by)}</span><span>confidence ${esc(d.confidence)}</span>
        <span>${esc(d.slack_days)} day${d.slack_days===1?"":"s"} of slack</span>
        ${(d.triggering_events||[]).length?`<span>triggered by ${esc(d.triggering_events.join(", "))}</span>`:""}
      </div><ul class="trail">${(d.reasoning_trail||[]).map(t=>
        `<li><span class="k">${esc(t.check)}</span> — ${esc(t.finding)}</li>`).join("")}</ul></div></div>` +
    ((s.drafts||[]).length?`<div class="sec"><p class="sec-t">Drafted communications</p>
      ${s.drafts.map(mailHTML).join("")}</div>`:"");
  $("panel").classList.add("on"); $("scrim").classList.add("on");
  $("panel-x").onclick = closePanel;
  bindApprove();
}
function closePanel(){ openId=null; $("panel").classList.remove("on"); $("scrim").classList.remove("on"); }
$("scrim").onclick = closePanel;
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

/* ---------- engine strip ---------- */
function renderEngine(){
  if (!ai || !ai.model){
    $("eng-model").textContent = hasRun ? "no provider — rules only" : "not yet resolved";
    $("eng-split").textContent = hasRun ? "decisions came from the deterministic fallbacks"
                                        : "resolves on the first run";
    return;
  }
  $("eng-model").textContent = ai.model;
  if (ai.decisions_total != null){
    $("eng-split").innerHTML = `${ai.decisions_from_model}/${ai.decisions_total} decisions ·
      ${ai.drafts_from_model}/${ai.drafts_total} drafts by model`;
  } else $("eng-split").textContent = ai.model_source || "";
}

/* ---------- run ---------- */
async function load(){
  const r = await fetch("/api/initial").then(r=>r.json());
  board = r.shipments; workers = r.workers||[]; ai = r.ai||null;
  scenarios = r.scenarios||[]; chosenScenario = chosenScenario || (r.scenarios||[{}])[0].id;
  render(); renderEngine();
}

async function run(){
  const btn = $("run");
  btn.disabled = true; approved.clear();
  let stage = 0;
  const names = ["Reading sources…","Triaging shipments…","Drafting communications…"];
  const advance = () => {
    workers = workers.map((w,i)=>({...w, status: i<stage?"done":i===stage?"working":"idle",
      summary: i<=stage?w.summary:"", detail: i<=stage?w.detail:[]}));
    btn.innerHTML = `<span class="spin"></span><span>${names[Math.min(stage,2)]}</span>`;
    render();
  };
  advance();
  const tick = setInterval(()=>{ stage = Math.min(stage+1, 2); advance(); }, 1500);
  try{
    const res = await fetch("/run",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({live:true,inject:true,use_llm:true,
        scenario:chosenScenario})}).then(r=>r.json());
    clearInterval(tick);
    if (res.state === "error"){
      notes = [res.error]; workers = workers.map(w=>({...w,status:"idle"}));
    } else {
      board=res.shipments; workers=res.workers||workers; risk=res.risk;
      ai=res.ai; summary=res.summary; notes=res.notes||[]; hasRun=true;
      scenario=res.scenario||null; scenarios=res.scenarios||scenarios;
      if (scenario) chosenScenario = scenario.id;
      if (!selected) selected = (board.find(x=>x.state!=="green")||{}).id || null;
      if (attention() && view === "overview") go("shipments");
    }
    render(); renderEngine();
  } catch(err){
    clearInterval(tick);
    notes = [`Could not reach the server: ${err.message}`]; render();
  } finally {
    btn.disabled = false;
    const nm = (scenarios.find(x=>x.id===chosenScenario)||{}).name;
    btn.innerHTML = `<span>${esc(nm ? "Run "+nm : "Run again")}</span>`;
  }
}
$("run").onclick = run;
theme(); load();
</script>
</body>
