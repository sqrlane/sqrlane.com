      ${g.items.map(i => {
        const n = i.count ? i.count() : 0;
        return `<button class="nav-i ${view===i.id?"on":""}" data-view="${esc(i.id)}">
          ${ICON[i.id] || ""}<span>${esc(i.label)}</span>
          ${n ? `<span class="pill ${i.quiet?"quiet":""}">${n}</span>` : ""}
        </button>`;
      }).join("")}
    </div>`).join("");

  const list = board.length ? `
    <div class="nav-g">
      <div class="nav-t">Board${hasRun?` <span class="nav-n">${attention()} actioned</span>`:""}</div>
      ${board.map(sh => `
        <button class="nav-s ${selected===sh.id?"on":""}" data-pick="${esc(sh.id)}"
                title="${esc(sh.cargo)} - ${esc(sh.origin)} to ${esc(sh.final_destination)}">
          <span class="sdot ${esc(sh.state)}"></span>
          <span class="sid">${esc(sh.id)}</span>
          <span class="scargo">${esc(sh.cargo)}</span>
        </button>`).join("")}
    </div>` : "";

  $("nav").innerHTML = groups + list;
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () =>
    pick(b.dataset.pick));                     // same selection the Workers react to
}
/* ---------- routing ----------
   The view lives in the URL. Refreshing keeps you where you were, the back
   button walks the views you visited, and a link to the queue is a link someone
   can actually send. Before this, every reload dropped you on Overview and the
   back button left the dashboard entirely. */
const VIEW_TITLES = {overview:"Overview", shipments:"Shipments", risk:"Risk feed",
                     approvals:"Approvals", connections:"TMS link",
                     simulation:"Simulation", map:"Map"};

function routeOf(){
  const parts = (location.hash || "").replace(/^#\/?/, "").split("/");
  const v = parts[0];
  return {view: VIEW_TITLES[v] ? v : "overview", id: parts[1] || null};
}

/* Idempotent by construction: if we wrote this hash ourselves the state already
   matches it and the handler returns without re-rendering, so no guard flag is
   needed to stop go() and the URL bouncing off each other. */
addEventListener("hashchange", () => {
  const r = routeOf();
  const idChanged = r.id && r.id !== selected && board.some(s => s.id === r.id);
  if (r.view === view && !idChanged) return;
  if (idChanged) selected = r.id;
  go(r.view, true);
});

function writeRoute(){
  const want = "#/" + view + (view === "shipments" && selected ? "/" + selected : "");
  if (location.hash !== want) location.hash = want;
}

/* Picking a booking is the same action from the sidebar, the palette or a row,
   so it lives in one place and always lands in the URL. */
function pick(id){
  selected = id;
  if (view !== "shipments") go("shipments"); else { writeRoute(); render(); }
}

function go(id, fromRoute){
  view = id;
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  $("v-"+id).classList.add("on");
  $("crumb").textContent = VIEW_TITLES[id];
  document.title = `${VIEW_TITLES[id]} · SQRlane`;
  $("scroll").scrollTop = 0;
  if (!fromRoute) writeRoute();
  render();
}

/* ---------- pieces ---------- */
/* Stat cards follow the reference's anatomy - label and a pill on the top row,
   a large tabular value, a caption underneath - but the pill carries a fact from
   this run rather than a trend. There is no history here to compare against, so
   a "+12% vs. previous 30 days" would be invented, and an invented number is the
   one thing this board cannot show. Same shape, honest contents. */
/* Schedule pressure - the decision rule, drawn. Every shipment carries slack;
   the disruption imposes a delay. Where the delay bar clears the slack bar there
   is no clean answer, and that is precisely the shipment worth reading. Both
   numbers come from the run, so this is the advisor's own arithmetic on screen.

   Series colours were validated for both themes (OKLCH lightness band, chroma
   floor, CVD separation and contrast against the card) rather than picked by
   eye - blue against purple, the obvious pairing, is near-identical under
   protanopia. */
function schedulePressure(){
  if (!hasRun) return "";
  const rows = board.map(s => ({
    id: s.id,
    slack: ((s.decision||{}).slack_days) || 0,
    delay: ((s.decision||{}).delay_days) || 0,
  }));
  if (!rows.length) return "";

  const W = 640, H = 252, L = 30, R = 10, T = 14, B = 42;
  const plotW = W - L - R, plotH = H - T - B;
  const peak = Math.max(2, ...rows.map(r => Math.max(r.slack, r.delay)));
  const top  = Math.ceil(peak / 2) * 2;               // even, so ticks are whole days
  const yOf  = v => T + plotH - (v / top) * plotH;
  const groupW = plotW / rows.length;
  const BW = Math.min(22, Math.max(8, (groupW - 14) / 2 - 1));   // <=24px, air either side
  const base = T + plotH;

  let ticks = [];
  for (let v = 0; v <= top; v += 2) ticks.push(v);
  // Hairline, solid, one step off the surface - a dashed grid reads as a
  // threshold when it is only a grid.
  const grid = ticks.map(v => `
    <line class="gl" x1="${L}" x2="${W-R}" y1="${yOf(v)}" y2="${yOf(v)}"/>
    <text class="ytick" x="${L-8}" y="${yOf(v)+4}">${v}</text>`).join("");

  // 4px rounded data-end, square where it meets the baseline.
  const barPath = (x, v, w) => {
    const h = (v / top) * plotH, yT = base - h, r = Math.min(4, h, w / 2);
    return `M${x},${base} L${x},${yT+r} Q${x},${yT} ${x+r},${yT}
            L${x+w-r},${yT} Q${x+w},${yT} ${x+w},${yT+r} L${x+w},${base} Z`;
  };

  const groups = rows.map((r, i) => {
    const cx = L + groupW * i + groupW / 2;
    const xS = cx - BW - 1, xD = cx + 1;          // the 2px surface gap between them
    const tight = r.delay > r.slack;              // the one that forces a decision
    return `
      <g class="grp">
        ${r.slack > 0 ? `<path class="b slack" d="${barPath(xS, r.slack, BW)}">
          <title>${esc(r.id)} - ${r.slack} days of slack</title></path>` : ""}
        ${r.delay > 0 ? `<path class="b delay ${tight?"tight":""}" d="${barPath(xD, r.delay, BW)}">
          <title>${esc(r.id)} - ${r.delay} days of delay</title></path>` : ""}
        ${tight ? `<text class="blab" x="${xD + BW/2}" y="${yOf(r.delay) - 7}">${r.delay}d</text>` : ""}
        <text class="xtick" x="${cx}" y="${base + 18}">${esc(r.id.replace("SHP-",""))}</text>
      </g>`;
  }).join("");

  const over = rows.filter(r => r.delay > r.slack).length;
  return `<div class="card chart-card">
    <div class="chart-h">
      <div><h2>Schedule pressure</h2>
        <p>Slack in hand against the delay this disruption imposes, in days</p></div>
      <div class="chart-lg">
        <span><i class="slack"></i>Slack</span><span><i class="delay"></i>Delay</span>
      </div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="Slack against imposed delay for each shipment, in days.${
           over ? ` ${over} shipment${over===1?"":"s"} face more delay than slack.` : ""}">
      ${grid}
      <line class="axis" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>
      ${groups}
    </svg>
    <p class="chart-f">${over
      ? `Where the delay bar clears the slack bar there is no clean answer — ${over} here.`
      : `Every delay fits inside the slack it had.`}</p>
  </div>`;
}

/* Board outcome, as the reference draws a distribution: a ring with the total in
   the middle and a legend carrying count and share. Every number is counted from
   the run - three outcomes over one pool is exactly what the ring is for. */
function outcomeRing(){
  if (!hasRun) return "";
  const parts = [
    {name:"Rerouted", n:(summary||{})["reroute"]||0, color:"var(--s-reroute)"},
    {name:"Held",     n:(summary||{})["hold"]||0,    color:"var(--s-hold)"},
    {name:"On plan",  n:(summary||{})["no-action"]||0, color:"var(--s-plan)"},
  ].filter(p => p.n > 0);
  const total = parts.reduce((a,b) => a + b.n, 0);
  if (!total) return "";

  const R = 68, C = 2 * Math.PI * R, GAP = parts.length > 1 ? 3 : 0;
  let at = 0;
  const arcs = parts.map(p => {
    const len = Math.max((p.n / total) * C - GAP, 1);
    const seg = `<circle cx="88" cy="88" r="${R}" fill="none" stroke="${p.color}"
       stroke-width="18" stroke-linecap="butt"
       stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-at}"
       transform="rotate(-90 88 88)"></circle>`;
    at += (p.n / total) * C;
    return seg;
  }).join("");

  return `<div class="card ring-card">
    <div class="ring-h"><h2>Board outcome</h2>
      <p>What the run decided across all ${total} shipments</p></div>
    <div class="ring-b">
      <svg viewBox="0 0 176 176" width="176" height="176" role="img"
           aria-label="Board outcome by decision">
        <circle cx="88" cy="88" r="${R}" fill="none" stroke="var(--surface)" stroke-width="18"></circle>
        ${arcs}
      </svg>
      <div class="ring-c"><div class="rv">${total}</div><div class="rl">Shipments</div></div>
    </div>
    <ul class="ring-l">${parts.map(p => `
      <li><span class="k"><i style="background:${p.color}"></i>${esc(p.name)}</span>
        <span class="v">${p.n}<span class="pc">${Math.round(p.n / total * 100)}%</span></span></li>`).join("")}
    </ul>
  </div>`;
}

function statCard({label, value, pill, tone, sub}){
  return `<div class="stat">
    <div class="stat-h"><span class="lab">${esc(label)}</span>
      ${pill ? `<span class="spill ${tone||""}">${esc(pill)}</span>` : ""}</div>
    <div class="val">${esc(value)}</div>
    <div class="sub">${esc(sub)}</div></div>`;
}

function statRow(){
  if (!hasRun) return "";
  const s = summary || {};
  const late = board.filter(b => b.decision && b.decision.deadline_breached).length;
  const onPlan = s["no-action"] || 0;
  const read = risk.live_sources_read || 0, total = risk.live_sources_total || 0;
  const queued = queuedWrites().length;
  return `<div class="stats">
    ${statCard({label:"Bookings from the TMS", value:board.length,
                pill:`${attention()} actioned`, tone:attention()?"blue":"",
                sub:`${onPlan} on plan · ${queued} change${queued===1?"":"s"} queued back`})}
    ${statCard({label:"Risk events", value:(risk.events||[]).length,
                pill:read?"live":"no live source", tone:read?"green":"amber",
                sub:`${read} of ${total} sources read · ${(risk.families||[]).length} families`})}
    ${statCard({label:"Deadlines at risk", value:late,
                pill:late?"breach":"clear", tone:late?"red":"green",
                sub:late?"customer date missed":"all within required-by"})}
    ${statCard({label:"Awaiting your approval", value:pending(),
                pill:pending()?"held":"clear", tone:pending()?"amber":"green",
                sub:pending()?`${draftsPending()} draft${draftsPending()===1?"":"s"} · ${
                  writesPending()} TMS change${writesPending()===1?"":"s"}`
                  :"everything approved"})}
  </div>`;
}

function rowHTML(s){
  const d=s.decision, idle=!d;
  const eta = d && d.delay_days
    ? `<span class="was">${esc(d.original_eta)}</span>${esc(d.revised_eta)}` : esc(s.eta);
  return `<button class="row ${s.state} ${idle?"idle":""}" data-open="${esc(s.id)}" ${idle?"disabled":""}>
    <span class="badge ${s.state}">${LABEL[s.state]}</span>
    <span class="who">
      <span class="id">${esc(s.id)}${s.cold_chain?" · cold chain":""}</span>
      <div class="cargo">${esc(s.cargo)}</div>
      <div class="lane">${esc(s.origin)} → ${esc(s.final_destination)}</div>
    </span>
    ${d?`<span class="hl">${esc(d.headline)}${d.fallback?`<span class="fb">rule</span>`:""}</span>`:""}
    <span class="eta"><span class="lab">${d&&d.delay_days?"Revised ETA":"ETA"}</span>
      <div class="val">${eta}</div>
      ${d&&d.deadline_breached?`<div class="breach">misses ${esc(d.required_by)}</div>`:""}</span>
  </button>`;
}

function shipmentGroups(){
  const act = board.filter(s=>s.state!=="green"), ok = board.filter(s=>s.state==="green");
  // The board is authored data and must say so wherever it appears, not only
  // in the legend - the provenance labels are the honest half of the demo.
  const head = t => `<p class="sec-t">${t} <span class="chip synth">synthetic</span></p>`;
  if (!hasRun) return head("In transit") + `<div class="rows">${board.map(rowHTML).join("")}</div>`;
  return (act.length? head(`Needs a decision — ${act.length}`) +
      `<div class="rows">${act.map(rowHTML).join("")}</div>`:"") +
    (ok.length? head(`On plan — ${ok.length}`) +
      `<div class="rows">${ok.map(rowHTML).join("")}</div>`:"");
}

function scenarioSwitcher(){
  if (!scenarios.length) return "";
  const active = (scenario||{}).id || chosenScenario || (scenarios[0]||{}).id;
  const sc = scenarios.find(x=>x.id===active) || scenarios[0];
  return `<p class="sec-t">Scenario <span class="chip synth">scripted</span></p>
    <div class="scen">${scenarios.map(x=>`
      <button class="scen-b ${x.id===active?"on":""}" data-scen="${esc(x.id)}">
        <span class="k">${esc(x.kind)}</span><span class="nm">${esc(x.name)}</span>
      </button>`).join("")}</div>
    <p class="scen-note"><b>${esc(sc.decision_type)}.</b> ${esc(sc.summary)}</p>`;
}

/* Every entry in this strip is a Worker, so the word is carried by the heading
   rather than repeated thirteen times. The full name stays in the tooltip and in
   the panel header, where there is room for it. */
function shortWorker(n){ return String(n).replace(/\s+Worker$/, ""); }

function rosterStrip(){
  if (!workers.length) return "";
  return `<p class="sec-t">Workers</p><div class="roster">${workers.map(w=>{
    const mode = w.mode==="live" ? "live" : w.mode==="demo" ? "demo" : "scripted";
    /* The summary was ellipsised to "Reads the wires, the regional …" at every
       width this strip is ever shown at, so it moves to the tooltip. The mode
       tag stays on screen: it is the honest half, and it is never abbreviated. */
    return `<button class="wchip ${openWorker===w.id?"on":""}" data-worker="${esc(w.id)}"
                    title="${esc(w.name)} — ${esc(w.summary || w.role)}">
      <span class="wdot" style="margin:0"></span>
      <span class="nm">${esc(shortWorker(w.name))}</span>
      <span class="wtag ${mode}">${mode}</span></button>`;}).join("")}</div>`;
}

function workerPanel(){
  if (!openWorker) return "";
  const w = workers.find(x=>x.id===openWorker); if (!w) return "";
  const ship = board.find(x=>x.id===selected) || board.find(x=>x.state!=="green") || board[0];
  const mode = w.mode==="live" ? "live" : w.mode==="demo" ? "demo" : "scripted";
  const ctx = `${ship?esc(ship.id):"no shipment"}${scenario?` · ${esc(scenario.name)}`:""}`;
  let body;
  if (mode === "live")      body = livePanelBody(w, ship);
  else if (!hasRun)         body = `<div class="empty">Run a scenario to populate this Worker.</div>`;
  else                      body = scriptedPanelBody(w, ship);
  return `<div class="wpanel"><div class="wpanel-h">
      <b>${esc(w.name)}</b><span class="wtag ${mode}">${mode}</span>
      <span class="ctx">${ctx}</span></div>
    <div class="wpanel-b">${body}</div></div>`;
}

function livePanelBody(w, ship){
  if (w.id === "risk") return riskCard(false);
  if (!ship || !ship.decision) return `<div class="empty">Run a scenario to populate this Worker.</div>`;
  const d = ship.decision;
  if (w.id === "routing")
    return `<div class="reason">${esc(d.reasoning)}</div>
      <div class="record" style="margin-top:12px"><div class="record-h">
        <span>${esc(ship.id)}</span><span>decided by ${esc(d.decided_by)}</span>
        <span>confidence ${esc(d.confidence)}</span></div>
      <ul class="trail">${(d.reasoning_trail||[]).map(t=>
        `<li><span class="k">${esc(t.check)}</span> — ${esc(t.finding)}</li>`).join("")}</ul></div>`;
  return (ship.drafts||[]).length ? ship.drafts.map(mailHTML).join("")
    : `<div class="empty">Nothing to draft — this shipment needs no action.</div>`;
}

function scriptedPanelBody(w, ship){
  const p = ((ship||{}).roster||{})[w.id];
  if (!p) return `<div class="empty">No scripted data for this selection.</div>`;
  if (w.id === "rate")
    return `<p class="sec-t">${esc(p.headline)}</p>
      ${p.surcharge_note?`<div class="warn" style="margin:0 0 10px">${esc(p.surcharge_note)}</div>`:""}
      <table class="q"><thead><tr><th>Carrier</th><th>Routing</th><th>Discharge</th>
        <th>Transit</th><th>Cost index</th></tr></thead><tbody>
        ${p.quotes.map(q=>`<tr class="${q.chosen?"pick":""}">
          <td>${esc(q.carrier)}</td><td>${esc(q.route_id)}</td><td>${esc(q.discharge_port)}</td>
          <td>${esc(q.transit_days)}d</td>
          <td>${esc(q.cost_index)}${q.cheapest?`<span class="qtag cheap">cheapest</span>`:""}${
            q.chosen?`<span class="qtag">booked</span>`:""}</td></tr>`).join("")}

    return `<p class="sec-t">${esc(p.headline)}</p><ul class="ms">${p.milestones.map(m=>
      `<li class="${m.done?"done":""} ${m.disruption?"dis":""}">${esc(m.label)}
        <span class="at">${esc(m.at)}</span></li>`).join("")}</ul>`;
  if (w.id === "booking")
    return `<p class="sec-t">${esc(p.headline)}</p>
      <div class="fields">
        <span class="f">Carrier ref</span><span>${esc(p.booking.carrier_ref)}</span>
        <span class="f">Vessel / voyage</span><span>${esc(p.booking.vessel)} ${esc(p.booking.voyage)}</span>
        <span class="f">Load port</span><span>${esc(p.booking.load_port)}</span>

      ${p.amendment ? `<div class="amend">
        <div class="amend-h">${esc(p.amendment.type)}</div>
        <div class="amend-r"><span class="was">${esc(p.amendment.from)}</span>
          <span class="arr">&rarr;</span><span class="now">${esc(p.amendment.to)}</span></div>
        <div class="amend-a">${esc(p.amendment.also)}</div>
        ${p.amendment.revised_eta?`<div class="amend-a">Revised ETA ${esc(p.amendment.revised_eta)}</div>`:""}
        <span class="gate-s awaiting">${esc(p.status)}</span>
      </div>` : `<div class="pnote">${esc(p.status)} — the booking stands as made.</div>`}
      <p class="pnote">${esc(p.note)}</p>`;
  if (w.id === "invoice")
    return `<p class="sec-t">${esc(p.headline)} · <span class="mono">${esc(p.invoice_ref)}</span></p>
      <table class="q"><thead><tr><th>Line</th><th>Agreed</th><th>Invoiced</th><th></th></tr></thead>
        <tbody>${p.lines.map(l=>{const bad=l.invoiced!==l.agreed; return `<tr class="${bad?"pick":""}">
          <td>${esc(l.description)}</td><td>${esc(l.agreed)}</td><td>${esc(l.invoiced)}</td>
          <td>${bad?`<span class="qtag">+${esc(l.invoiced-l.agreed)}</span>`:""}</td></tr>`}).join("")}
        </tbody></table>
      <div class="${p.matched?"pnote":"warn"}" style="margin-top:10px">${esc(p.finding)}</div>
      <p class="pnote">${esc(p.note)}</p>`;
  if (w.id === "customs")
    return `<p class="sec-t">${esc(p.headline)}</p>
      <div class="fields">
        <span class="f">Country of entry</span><span>${esc(p.entry.country)}</span>
        <span class="f">Office</span><span>${esc(p.entry.office)}</span>
        <span class="f">EORI prefix</span><span>${esc(p.entry.eori_prefix)}</span>
        <span class="f">Regime</span><span>${esc(p.entry.regime)}</span>
      </div>
      <ul class="ck">${p.checks.map(c=>`<li class="${
        c.state==="on file"||c.state==="classified"?"ok":"todo"}">${esc(c.item)}
        <span class="at">${esc(c.state)}</span></li>`).join("")}</ul>
      ${p.escalate?`<div class="warn">${esc(p.escalate)}</div>`:""}
      <span class="gate-s ${p.escalate?"awaiting":"approved"}">${esc(p.status)}</span>
      <p class="pnote">${esc(p.note)}</p>`;
  if (w.id === "docs")
    return `<p class="sec-t">${esc(p.headline)}</p>
      <div class="fields">${p.fields.map(f=>
        `<span class="f">${esc(f.field)}</span><span>${esc(f.value)}</span>`).join("")}</div>

    return `<p class="sec-t">${esc(p.headline)}</p>
      <p class="pnote">${esc(p.note)}</p>
      ${p.items.map(m=>`<div class="inb">
        <div class="inb-h">

  if (w.id === "rfq")
    return `<p class="sec-t">${esc(p.headline)}</p>

        <div class="fields">${Object.entries(p.parsed||p.request.parsed).map(([k,v])=>

      </div>
      <table class="q"><thead><tr><th>Carrier</th><th>Via</th><th>Transit</th>
        <th>Cost index</th></tr></thead><tbody>
        ${p.options.map(o=>`<tr class="${o===p.options[0]?"pick":""}">
          <td>${esc(o.carrier)}</td><td>${esc(o.discharge_port)}</td>
          <td>${esc(o.transit_days)}d</td>
          <td>${esc(o.cost_index)}${o.surcharge?`<span class="qtag">${esc(o.surcharge)}</span>`:""}</td>
        </tr>`).join("")}
      </tbody></table>
      ${p.draft_reply?`<div class="inb-r"><div class="inb-rl">Drafted quote</div>${
        esc(p.draft_reply)}</div>`:""}
      <span class="gate-s awaiting">${esc(p.status)}</span>`;

  if (w.id === "tms")
    return `<p class="sec-t">${esc(p.headline)}
        <span class="chip">${esc(p.status)}</span></p>
      <p class="pnote">${esc(p.positioning||"")}</p>
      <div class="fields">
        <span class="f">record</span><span class="mono">${esc(p.record.booking_ref)}
          <span class="qtag">${esc(p.record.record_status)}</span></span>
        <span class="f">carrier booking</span><span class="mono">${esc(p.record.carrier_booking)}</span>
        <span class="f">source system</span><span>${esc(p.record.source_system)}</span>
      </div>
      <div class="inb-rl" style="margin-top:12px">What each Worker writes to this booking</div>
      <div class="fields">${(p.agent_records||[]).map(a=>
        `<span class="f">${esc(a.agent)}</span>
         <span>${esc(a.writes)} <span class="qtag">${esc(a.record)}</span></span>`).join("")}</div>
      <div class="inb-rl" style="margin-top:12px">Queued back against it</div>
      ${(p.writebacks||[]).length ? p.writebacks.map(wbHTML).join("")
        : `<div class="pnote">On plan — this booking needs no write-back.</div>`}
      <p class="pnote" style="margin-top:12px">${esc(p.note)}</p>`;

  return `<p class="sec-t">${esc(p.headline)}</p><ul class="qa">${p.qa.map(x=>
    `<li><div class="q">${esc(x.q)}</div><div class="a">${esc(x.a)}</div></li>`).join("")}</ul>`;
}

function workersCard(){
  /* The three that actually run. The full roster has its own strip above, and
     listing all thirteen here under a "3" badge was saying two different things
     at once. These are the ones with a summary to report. */
  const live = workers.filter(w => w.mode === "live");
  return `<div class="card" style="margin-bottom:20px">
    <div class="card-h"><h2>Workers</h2><span class="n">${live.length}</span></div>
    ${live.map(w=>`<div class="worker ${w.status}"><span class="wdot"></span>
      <div style="flex:1;min-width:0">
        <div class="wname">${esc(w.name)}${w.seconds!=null?`<span class="wsecs">${esc(w.seconds)}s</span>`:""}</div>
        <div class="wrole">${esc(w.role)}</div>
        ${w.summary?`<div class="wsum">${esc(w.summary)}</div>`:""}
        ${(w.detail||[]).length?`<ul class="wdet">${w.detail.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>`:""}
      </div></div>`).join("")}</div>`;
}

/* The event and the decisions it caused were already linked in the data -
   decision.triggering_events carries the event_id - and the feed simply never
   used it. Without this the risk view is a dead end: it tells you a strike
   closed HAM and leaves you to work out by hand which bookings that moved,
   which is the manual bridge this product exists to remove. */
function affectedBy(e){
  if (!hasRun) return "";
  const hit = board.filter(s =>
    ((s.decision||{}).triggering_events||[]).includes(e.event_id));
  if (!hit.length) return `<div class="ev-aff none">No booking on this board is
    exposed to ${esc(e.chokepoint)} — read, classified, and correctly actioned nothing.</div>`;
  return `<div class="ev-aff">
    <span class="lbl">${hit.length} booking${hit.length===1?"":"s"} moved by this</span>
    ${hit.map(s=>`<button class="aff-b" data-pick="${esc(s.id)}"
        title="${esc(s.cargo)} — open on the board">
        <span class="sdot ${esc(s.state)}"></span><span class="mono">${esc(s.id)}</span>
        <span class="aff-d">${esc(LABEL[s.state])}</span></button>`).join("")}</div>`;
}

function riskCard(compact){
  const ev = risk.events||[];
  /* live_sources_* are counted in risk_monitor, which is the one place that
     knows the scripted scenario reports itself as a source. Counting it here
     would inflate both halves of the number an audience uses to check that the
     news pull is real. The failed list is filtered the same way. */
  const srcs = (risk.sources||[]).filter(s=>!/^scenario:/.test(s.name||""));
  const ok = risk.live_sources_read||0, total = risk.live_sources_total||srcs.length;
  const bad = srcs.filter(s=>s.status==="failed");
  /* The chip and the tick are claims about THIS run, so both are computed from
     it. A board that read nothing must never wear a green "live" or a ✓ against
     a zero - that is the one claim this demo cannot afford to fake, and a
     blocked network is exactly when it would. Said the same way as the stat
     card, which has always got this right. */
  const anyRead = ok > 0;
  return `<div class="card">
    <div class="card-h"><h2>Risk feed</h2>${anyRead
      ? `<span class="chip live">live</span>`
      : `<span class="chip off">no live source</span>`}<span class="n">${ev.length}</span></div>
    ${ev.length ? ev.map(e=>`<div class="event">
      <div class="tags">
        <span class="tag ${e.origin==="injected"?"inj":"livesrc"}">${e.origin==="injected"?"scripted":"live"}</span>
        <span class="tag ${esc(e.severity)}">${esc(e.severity)}</span>
        <span class="tag">${esc(e.chokepoint)} ${esc(e.type)}</span>
        <span class="tag lang">${esc(regionOf(e))}</span>
      </div>
      <div class="ev-title">${esc(e.title)}</div>
      ${e.title_original?`<div class="orig" dir="${RTL.has(e.source_language)?"rtl":"ltr"}"
        lang="${esc(e.source_language)}" title="As first published">${esc(e.title_original)}</div>`:""}
      <div class="ev-src">${esc(e.detected_first_from||e.source)}</div>
      ${!compact && e.reasoning?`<div class="ev-why">${esc(e.reasoning)}</div>`:""}
      ${detectionTrail(e, compact)}
      ${affectedBy(e)}
    </div>`).join("") : `<div class="empty">No active events.<br>Press <b>Inject Hamburg strike</b> to start.</div>`}
    ${srcs.length?`<div class="srcline">
      <div class="r">${anyRead?"✓":"!"} ${ok} of ${total} sources read</div>
      ${familyStrip()}
      ${bad.length?`<div class="r">! unavailable: ${esc(bad.slice(0,4).map(s=>s.name.replace(/^(RSS|GDELT|PEGELONLINE): /,"").replace(/\s*\[\w{2}\]$/,"")).join(", "))}${bad.length>4?` +${bad.length-4} more`:""}</div>`:""}
    </div>`:""}</div>`;
}

/* The families, not the forty rows. A source that answered and a source that
   did not are both counted, because the denominator is what the claim rests on. */
function familyStrip(){
  const fams = risk.families || [];
  if (!fams.length) return "";
  return `<div class="fams">${fams.map(f=>`<span class="fam ${f.tier==="context"?"ctx":""}"
    title="${f.tier==="context"?"Read live, and moves nothing on this board":"Can put an exception on a booking"}">
    ${esc(f.label)} <b>${f.read}/${f.total}</b></span>`).join("")}</div>`;
}

/* The instruments: what the numbers actually read this run.

   These are LANE sources - a gust or a wave height over its threshold becomes an
   event in the feed above - so they are NOT lumped in with the context card.
   Most readings are quiet, and showing the quiet ones is the point: a board that
   only ever displayed alarms would be lying about the shape of the job. */
function instrumentCard(){
  const c = risk.context || {};
  const tiles = [];
  (c.ports || []).forEach(r => tiles.push(
    {k:`Wind · ${esc(r.name)}`, v:`${r.gusts_kn} kn`, s:esc(r.state), sev:r.severity}));
  (c.seas || []).forEach(r => tiles.push(
    {k:`Sea · ${esc(r.name)}`, v:`${r.wave_m} m`, s:esc(r.state), sev:r.severity}));
  if (!tiles.length) return "";
  const firing = tiles.filter(t => t.sev).length;
  return `<div class="card" style="margin-top:20px">
    <div class="card-h"><h2>Instrument readings</h2><span class="chip live">live</span>
      <span class="n">${tiles.length}</span></div>
    <div class="ctxgrid">${tiles.map(t=>`<div class="ctxi ${t.sev?"hot":""}">
      <div class="k">${t.k}</div><div class="v">${t.v}</div><div class="s">${t.s}</div>
    </div>`).join("")}</div>
    <div class="srcline"><div class="r">Read by threshold, not by the model — a number cannot be
      misread into a severity. ${firing
        ? `${firing} of ${tiles.length} crossed a threshold and ${firing===1?"is":"are"} in the feed above; the rest are quiet, which is the usual answer.`
        : `None crossed a threshold on this run, which is the usual answer.`}</div></div>
  </div>`;
}

/* Board context - readings that are real and decide nothing. Kept apart from
   the instruments above, and labelled in words rather than by position. */
function contextCard(){
  const c = risk.context || {};
  const tiles = [];
  (c.fx?.pairs || []).forEach(p => tiles.push(
    {k:esc(p.pair), v:Number(p.rate).toFixed(4), s:`ECB reference, ${esc(c.fx.as_of||"")}`}));
  (c.hk_warnings || []).slice(0,3).forEach(w => tiles.push(
    {k:"Hong Kong", v:esc(w.code||"—"), s:esc(w.name||"")}));
  (c.us_alerts || []).slice(0,3).forEach(a => tiles.push(
    {k:"US ports", v:esc(a.event||"—"), s:esc(a.area||"")}));
  if (!tiles.length) return "";
  return `<div class="card" style="margin-top:20px">
    <div class="card-h"><h2>Board context</h2><span class="chip live">live</span>
      <span class="n">${tiles.length}</span></div>
    <div class="ctxgrid">${tiles.map(t=>`<div class="ctxi">
      <div class="k">${t.k}</div><div class="v">${t.v}</div><div class="s">${t.s}</div>
    </div>`).join("")}</div>
    <div class="srcline"><div class="r">The rate a reroute is billed at, and weather over ports
      this board does not call at. Read live on this run, and none of it moves a booking here —
      shown rather than implied, and never promoted to look like risk.</div></div>
  </div>`;
}

const RTL = new Set(["ar","he","fa","ur"]);

/* Where a source sits, not what language it publishes in. The edge is proximity:
   a local outlet carries a disruption while the international wires are still
   downstream of it. Which language that happens to be in is incidental, so the
   dashboard never names one. */
/* Where a source sits, not what language it publishes in. The edge is proximity
   to the event; naming a language would make a general capability look like one
   rehearsed trick, so only these two words ever reach the screen. Anything not
   listed is regional by default - a new corridor's press should not have to be
   registered here before it can be labelled. */
const REGION = {de:"Regional", ar:"Regional", fr:"Regional", nl:"Regional",
                es:"Regional", it:"Regional", tr:"Regional", zh:"Regional",
                ja:"Regional", pt:"Regional", en:"International"};

/* Events carry `source_language`; the entries in a detection trail carry
   `language`. Reading only the first meant every trail row - including the
   international wire the whole lead is measured against - was labelled
   "Regional", which is the one row where that word is wrong. */
function regionOf(e){
  return REGION[e.source_language || e.language] || "Regional";
}

function offsetLabel(mins){
  if (!mins) return "first";
  if (mins < 90) return `+${mins}m`;
  const h = Math.round(mins/60);
  return h < 48 ? `+${h}h` : `+${Math.round(h/24)}d`;
}

/* The earliness claim, shown rather than asserted: which sources carried the
   story, in what order, and how far behind the international wires were.
   Named by outlet, never by language - the lead comes from reading sources
   close to the event, and that holds wherever in the world it happens. */
function detectionTrail(e, compact){
  const trail = e.language_trail || [];
  if (trail.length < 2) return "";
  const first = trail.find(t=>t.first) || trail[0];
  const wire  = trail.find(t=>t.english_wire);
  const lead  = wire && !wire.first
    ? `Seen ${offsetLabel(wire.offset_minutes).replace("+","")} before the international wires`
    : null;
  const outlets = trail.length;
  if (compact) {
    return `<div class="ltrail"><div class="ltrail-h">Carried by ${outlets} sources</div>
      <div class="lt first"><span class="lg">${esc(regionOf(first))}</span>
        <span class="src">${esc(first.source)}</span><span class="off">first</span></div>
      ${lead?`<div class="lead">${esc(lead)}</div>`:""}</div>`;
  }
  return `<div class="ltrail"><div class="ltrail-h">Detection trail — ${outlets} sources</div>
    ${trail.map(t=>`<div class="lt ${t.first?"first":""} ${t.english_wire&&!t.first?"wire":""}">
      <span class="lg">${esc(regionOf(t))}</span>
      <span class="src">${esc(t.source)}</span>
      <span class="off">${esc(offsetLabel(t.offset_minutes))}</span></div>`).join("")}
    ${lead?`<div class="lead">${esc(lead)}</div>`:""}</div>`;
}

function legendCard(){
  return `<div class="card" style="padding:14px 16px;margin-bottom:20px">
    <div class="keys">
      <span class="key"><i class="sw live"></i><span><b>Live</b> — the risk feed. Real news from sources worldwide, pulled now.</span></span>
      <span class="key"><i class="sw synth"></i><span><b>Synthetic</b> — the bookings on the board and the injected strike.</span></span>
      <span class="key"><i class="sw draft"></i><span><b>Drafted, never sent</b> — approval changes state only.</span></span>
      <span class="key"><i class="sw tms"></i><span><b>Through the TMS</b> — bookings read from the system of record; every action queued back to it.</span></span>
    </div>
    <div class="said">“The risk detection is real — it runs against live news right now. The shipments are
      synthetic, so I can show you a disruption on demand instead of waiting for one.
      The Workers act on them the way they would act on your book: read from the TMS, written back to it,
      approved by you.”</div></div>`;
}

  document.querySelectorAll("[data-aprow]").forEach(b => b.onclick = () => {
    const k = b.dataset.aprow;
    apOpen.has(k) ? apOpen.delete(k) : apOpen.add(k);
    render();
  });
  document.querySelectorAll("[data-apsel]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const k = b.dataset.apsel;
    apSel.has(k) ? apSel.delete(k) : apSel.add(k);
    render();
  });
  document.querySelectorAll("[data-apall]").forEach(b => b.onclick = () => {
    const items = apItems().filter(i => !approved.has(i.k));
    if (b.dataset.apall === "all") items.forEach(i => apSel.add(i.k));
    else apSel.clear();
    render();
  });
  document.querySelectorAll("[data-apbulk]").forEach(b => b.onclick = () => {
    // Still only a state change, in bulk: there is no transport to reach.
    apSel.forEach(k => approved.add(k));
    apSel.clear(); render();
  });
  document.querySelectorAll("[data-mappick]").forEach(b => b.onclick = () => {
    mapPick = (mapPick === b.dataset.mappick) ? null : b.dataset.mappick; render();
  });
  document.querySelectorAll("[data-lane]").forEach(b => b.onclick = () => {
    mapPick = b.dataset.lane; render();
  });
  const clr = $("map-clear");
  if (clr) clr.onclick = () => { mapPick = null; render(); };
  const simBtn = $("sim-run");
  if (simBtn) simBtn.onclick = runSimulation;
  document.querySelectorAll("[data-simday]").forEach(b => b.onclick = () => {
    simDay = Number(b.dataset.simday); render();
  });
  document.querySelectorAll("[data-scen]").forEach(b => b.onclick = () => {
    chosenScenario = b.dataset.scen; render(); run();
  });
  document.querySelectorAll("[data-worker]").forEach(b => b.onclick = () => {
    openWorker = openWorker === b.dataset.worker ? null : b.dataset.worker;
    render();
  });
  bindApprove();
  initCollapse();
  initPalette();
  initKeys();
  $("bell").onclick = () => go("approvals");
  renderNav();
}

let approvalTab = "waiting";
let apOpen = new Set();     // rows expanded to their full body
let apSel  = new Set();     // rows ticked for a bulk approve

/* Everything waiting on a person, flattened to rows and keyed exactly the way
   the approved set is keyed. A drafted email and a queued TMS change are the
   same kind of thing here - work the Workers finished that leaves the building -
   so one row renderer covers both and one gate holds both.

   Grouped by booking rather than by kind: a write-back's booking_ref IS the
   shipment id, so everything waiting on SHP-001 - its carrier mail, its customer
   mail and the changes queued against the record - reads as one block. That is
   the product's own claim ("every decision lands on the booking it came from")
   made navigable instead of asserted. */
function apItems(){
  const out = [];
  board.forEach(sh => (sh.drafts||[]).forEach(m => out.push({
    k: key(m), sh, kind: "mail",
    title: m.subject,
    sub: `to the ${m.audience} · ${m.to}`,
    flag: m.fallback ? "template" : "", flagTitle: m.fallback_reason || "",
    mail: m,
  })));
  queuedWrites().forEach(w => {
    const sh = board.find(x => x.id === w.booking_ref);
    out.push({
      k: wkey(w), sh, kind: "write",
      title: (w.changes||[]).length
        ? (w.changes||[]).map(c => `${c.field} → ${c.to}`).join(" · ")
        : `${w.operation} · ${w.record}`,
      sub: `${w.agent} · ${w.record}`,
      wb: w,
    });
  });
  return out;
}

function apRowHTML(i){
  const ok = approved.has(i.k), open = apOpen.has(i.k), sel = apSel.has(i.k);
  return `<div class="ap-r ${open?"open":""} ${ok?"done":""}">
    <div class="ap-rh" data-aprow="${esc(i.k)}">
      ${ok ? `<span class="ap-ck done" title="Approved">${ICON.check}</span>`
           : `<button class="ap-ck ${sel?"on":""}" data-apsel="${esc(i.k)}"
                      role="checkbox" aria-checked="${sel}"
                      aria-label="Select for bulk approval">${ICON.check}</button>`}
      <span class="qtag ${i.kind==="write"?"":"cheap"}">${i.kind==="write"?"TMS":"MAIL"}</span>
      <span class="ap-t">${esc(i.title)}</span>
      ${i.flag?`<span class="fb" title="${esc(i.flagTitle)}">${esc(i.flag)}</span>`:""}
      <span class="ap-sub">${esc(i.sub)}</span>
      <span class="ap-st ${ok?"approved":"awaiting"}">${ok?"approved":"awaiting"}</span>
      ${ok?"":`<button class="approve sm" data-approve="${esc(i.k)}">Approve</button>`}
      <span class="ap-x">${ICON.chev}</span>
    </div>
    ${open ? `<div class="ap-rb">${i.kind==="mail"?mailHTML(i.mail):wbHTML(i.wb)}</div>` : ""}
  </div>`;
}

function approvalsView(){
  if (running) return skeletonRows(4);
  const all = apItems();
  if (!all.length) return emptyState({
    icon: "approvals", title: "Nothing waiting yet",
    body: `Press <b>Run</b>. Any booking that needs action gets a carrier and a
           customer email, and the change it implies is queued back into the TMS.
           All of it waits here for you — nothing is sent, and nothing is written.`});

  const waiting = i => !approved.has(i.k);
  const counts = {waiting: all.filter(waiting).length,
                  approved: all.filter(i => !waiting(i)).length};

  const tabs = segmented([
    {id:"waiting",  label:"Awaiting you", n:counts.waiting},
    {id:"approved", label:"Approved",     n:counts.approved},
    {id:"all",      label:"All",          n:all.length},
  ], approvalTab, "atab");

  const shown = all.filter(i => approvalTab === "all" ? true
                              : approvalTab === "waiting" ? waiting(i) : !waiting(i));

  // Only an unapproved row can be selected, so the bulk count can never claim
  // work that is already done.
  const selectable = shown.filter(waiting);
  const picked = selectable.filter(i => apSel.has(i.k));
  const bar = selectable.length ? `<div class="ap-bar">
      <span class="n">${picked.length ? `<b>${picked.length}</b> of ${selectable.length} selected`
        : `<b>${selectable.length}</b> awaiting you`} · nothing is sent, and nothing is written</span>
      <button class="ap-lnk" data-apall="${picked.length===selectable.length?"none":"all"}">${
        picked.length===selectable.length ? "Clear selection" : `Select all ${selectable.length}`}</button>
      ${picked.length?`<button class="approve sm" data-apbulk="1">Approve ${picked.length} selected</button>`:""}
    </div>` : "";

  // One block per booking, in board order, then anything whose booking is not on
  // the board (there is none today, but a write-back could outlive a card).
  const order = board.map(s => s.id);
  const byShip = new Map();
  shown.forEach(i => {
    const id = (i.sh||{}).id || "—";
    if (!byShip.has(id)) byShip.set(id, []);
    byShip.get(id).push(i);
  });
  const groups = [...byShip.entries()]
    .sort((a,b) => order.indexOf(a[0]) - order.indexOf(b[0]))
    .map(([id, items]) => {
      const sh = board.find(x => x.id === id);
      const nWait = items.filter(waiting).length;
      return `<div class="ap-g">
        <div class="ap-h">
          ${sh?`<span class="badge ${sh.state}">${LABEL[sh.state]}</span>`:""}
          <b>${esc(id)}${sh?` · ${esc(sh.cargo)}`:""}</b>
          <span class="ap-c">${sh?esc(sh.customer||""):""}</span>
          <span class="ap-c" style="margin-left:auto">${
            nWait ? `${nWait} awaiting` : "all approved"}</span>
        </div>
        <div class="ap-rows">${items.map(apRowHTML).join("")}</div></div>`;
    }).join("");

  const body = groups || emptyState({
    icon: "approvals",
    title: approvalTab === "waiting" ? "Nothing waiting on you" : "Nothing approved yet",
    body: approvalTab === "waiting"
      ? "Every draft and every write-back has been approved. Approving is a state change here and nothing else — there is no transport in the app to send an email, and no client to write to a TMS."
      : "Approve something and it moves here."});

  return `${tabs}${bar}${body}`;
}

function mailHTML(m){
  const k = key(m), ok = approved.has(k);
  return `<div class="mail">
    <div class="mail-h"><div class="to">To the ${esc(m.audience)}: ${esc(m.to)}${
      m.fallback?`<span class="fb" title="${esc(m.fallback_reason||"")}">template</span>`:""}</div>
      <div class="subj">${esc(m.subject)}</div>
      ${m.fallback&&m.fallback_reason?`<div class="subj" style="color:var(--amber)">model unavailable: ${esc(m.fallback_reason)}</div>`:""}</div>
    <div class="mail-b">${esc(m.body)}</div>
    <div class="gate">
      <span class="gate-s ${ok?"approved":"awaiting"}">${ok?"Approved — ready to send":"Awaiting approval"}</span>
      ${ok?"":`<button class="approve" data-approve="${esc(k)}">Approve</button>`}
      <span class="never">nothing is transmitted — approval is a state change</span>
    </div></div>` +
    (m.warnings||[]).map(w=>`<div class="warn">Fix before sending: ${esc(w)}</div>`).join("");
}

function bindApprove(){
  document.querySelectorAll("[data-approve]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    approved.add(b.dataset.approve);   // state change only; nothing is sent
    render(); if (openId) openPanel(openId, true);
  });
}

/* ---------- slide-over ---------- */
function openPanel(id, keep){
  const s = board.find(x=>x.id===id); if (!s || !s.decision) return;
  openId = id;
  const d = s.decision;
  $("panel-h").innerHTML = `<div style="flex:1">
      <div style="display:flex;align-items:center;gap:9px">
        <span class="badge ${s.state}">${LABEL[s.state]}</span>
        <b style="font-size:15px">${esc(s.id)} · ${esc(s.cargo)}</b></div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:4px">
        ${esc(s.origin)} → ${esc(s.final_destination)} · ${esc(s.customer||"")}</div></div>
    <button class="icon-btn" id="panel-x">${ICON.close}</button>`;
  // Slack consumed is the number the whole decision turns on: the delay this
  // disruption imposes against the slack the booking had. Over 100% means the
  // delay does not fit, which is exactly when there is no clean answer.
  const slack = d.slack_days || 0, delay = d.delay_days || 0;
  const pct = slack > 0 ? (delay / slack) * 100 : (delay ? 100 : 0);
  const tone = pct > 100 ? "bad" : pct > 66 ? "warn" : "";
  const fits = delay <= slack;

  $("panel-b").innerHTML =
    `<div class="sec sl">
      ${notchGauge(pct, "slack used", tone)}
      <div class="sl-t">
        <b>${delay}d of delay against ${slack}d of slack</b>
        <span>${fits ? "The delay fits inside the schedule it had."
          : "The delay does not fit — there is no option that arrives on time."}</span>
        ${d.deadline_breached ? `<span class="sl-x">Misses the required-by date of ${
          esc(d.required_by||"")}</span>` : ""}
      </div>
    </div>` +
    `<div class="sec"><p class="sec-t">Why</p><div class="reason">${esc(d.reasoning)}</div>
      ${(d.rejected_options||[]).length?`<ul class="rejected">${d.rejected_options.map(o=>
        `<li><b>${esc(o.route_id)}</b> — ${esc(o.why_not)}</li>`).join("")}</ul>`:""}</div>` +
    (d.decision==="reroute"?`<div class="sec"><p class="sec-t">Routing change</p>
      <div class="reason">${esc(d.route_before)} → <b>${esc(d.recommended_route)}</b><br>
      <span style="color:var(--muted);font-size:13px">${esc(d.recommended_route_description||"")} ·
      discharge ${esc(d.recommended_discharge_port||"")} · then ${esc(d.recommended_inland_leg||"")}</span>
      </div></div>`:"") +
    `<div class="sec"><p class="sec-t">Decision record · ${esc((d.decided_at||"").replace("T"," ").replace("+00:00"," UTC"))}</p>
      <div class="record"><div class="record-h">
        <span>decided by ${esc(d.decided_by)}</span><span>confidence ${esc(d.confidence)}</span>
        <span>${esc(d.slack_days)} day${d.slack_days===1?"":"s"} of slack</span>
        ${(d.triggering_events||[]).length?`<span>triggered by ${esc(d.triggering_events.join(", "))}</span>`:""}
      </div><ul class="trail">${(d.reasoning_trail||[]).map(t=>
        `<li><span class="k">${esc(t.check)}</span> — ${esc(t.finding)}</li>`).join("")}</ul></div></div>` +
    ((s.drafts||[]).length?`<div class="sec"><p class="sec-t">Drafted communications</p>
      ${s.drafts.map(mailHTML).join("")}</div>`:"") +
    // Where the decision actually lands. The card is a view of a TMS booking,
    // and this is the change queued back onto that record.
    (tmsWrites(s.id).length?`<div class="sec">
      <p class="sec-t">Queued to ${esc(tmsLink.connector||"the TMS")}
        <span class="chip">${esc(tmsLink.status||"")}</span></p>
      <p class="pnote">${esc(s.source_system?`Booking read from ${s.source_system}. `:"")}${
        esc(tmsLink.honesty||"")}</p>
      ${tmsWrites(s.id).map(wbHTML).join("")}</div>`:"");
  $("panel").classList.add("on"); $("scrim").classList.add("on");
  $("panel-x").onclick = closePanel;
  bindApprove();
}
/* Every change this run queues back onto one booking. */
function tmsWrites(id){ return queuedWrites().filter(w => w.booking_ref === id); }

function closePanel(){ openId=null; $("panel").classList.remove("on"); $("scrim").classList.remove("on"); }
$("scrim").onclick = closePanel;
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

/* ---------- engine strip ---------- */
function renderEngine(){
  if (!ai || !ai.model){
    $("eng-model").textContent = hasRun ? "no provider — rules only" : "not yet resolved";
    $("eng-split").textContent = hasRun ? "decisions came from the deterministic fallbacks"
                                        : "resolves on the first run";
    return;
  }
  $("eng-model").textContent = ai.model;
  if (ai.decisions_total != null){
    $("eng-split").innerHTML = `${ai.decisions_from_model}/${ai.decisions_total} decisions ·
      ${ai.drafts_from_model}/${ai.drafts_total} drafts by model`;
  } else $("eng-split").textContent = ai.model_source || "";
}

async function runSimulation(){
  simBusy = true; render();
  try {
    const r = await fetch("/api/simulation").then(r => r.json());
    sim = r.error ? {} : r;
    simDay = (sim.days||[]).length ? sim.days[0].day : null;
    if (r.error) notes = [`The simulation failed: ${r.error}`];
  } catch (err) {
    notes = [`Could not reach the server: ${err.message}`];
  }
  simBusy = false; render(); renderNav();
}

/* ---------- run ---------- */
async function load(){
  const r = await fetch("/api/initial").then(r=>r.json());
  board = r.shipments; workers = r.workers||[]; ai = r.ai||null; tmsLink = r.tms||{}; atlas = r.map||{};
  scenarios = r.scenarios||[]; chosenScenario = chosenScenario || (r.scenarios||[{}])[0].id;
  // Land on whatever the URL asked for, now that there is a board to select from.
  const r0 = routeOf();
  if (r0.id && board.some(s => s.id === r0.id)) selected = r0.id;
  if (r0.view !== "overview") go(r0.view, true); else { render(); }
  renderEngine();
}

async function run(){
  const btn = $("run");
  btn.disabled = true; approved.clear(); running = true;
  let stage = 0;
  const names = ["Reading sources…","Triaging shipments…","Drafting communications…"];
  const advance = () => {
    workers = workers.map((w,i)=>({...w, status: i<stage?"done":i===stage?"working":"idle",
      summary: i<=stage?w.summary:"", detail: i<=stage?w.detail:[]}));
    btn.innerHTML = `<span class="spin"></span><span>${names[Math.min(stage,2)]}</span>`;
    render();
  };
  advance();
  const tick = setInterval(()=>{ stage = Math.min(stage+1, 2); advance(); }, 1500);
  try{
    const res = await fetch("/run",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({live:true,inject:true,use_llm:true,
        scenario:chosenScenario})}).then(r=>r.json());
    clearInterval(tick);
    // Clear this BEFORE the render below: the views key their skeleton off it,
    // and the finally block runs after that render, so leaving it there left
    // every view stuck on its skeleton with the real data already in hand.
    running = false;
    if (res.state === "error"){
      notes = [res.error]; workers = workers.map(w=>({...w,status:"idle"}));
    } else {
      board=res.shipments; workers=res.workers||workers; risk=res.risk; tmsLink=res.tms||{};
      atlas=res.map||{};
      ranAt=new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      ai=res.ai; summary=res.summary; notes=res.notes||[]; hasRun=true;
      scenario=res.scenario||null; scenarios=res.scenarios||scenarios;
      if (scenario) chosenScenario = scenario.id;
      if (!selected) selected = (board.find(x=>x.state!=="green")||{}).id || null;
      if (attention() && view === "overview") go("shipments");
    }
    render(); renderEngine();
  } catch(err){
    clearInterval(tick);
    running = false;
    notes = [`Could not reach the server: ${err.message}`]; render();
  } finally {
    btn.disabled = false; running = false;   // belt and braces if we never got that far
    const nm = (scenarios.find(x=>x.id===chosenScenario)||{}).name;
    btn.innerHTML = `<span>${esc(nm ? "Run "+nm : "Run again")}</span>`;
  }
}
$("run").onclick = run;
theme(); load();
</script>
