<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQRlane — trade-lane risk, decided</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%23171717'/%3E%3Cpath d='M3 11.2h10M3 8h6.5M3 4.8h3.5' stroke='%23fff' stroke-width='1.7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Geist, self-hosted from static/fonts/ - the same faces the landing page is
   set in, so the two pages read as one product. No CDN: the page must load no
   external asset. */
@font-face{
  font-family:"Geist";
  src:url("/fonts/Geist-Variable.woff2") format("woff2-variations"),
      url("/fonts/Geist-Variable.woff2") format("woff2");
  font-weight:100 900; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"Geist Mono";
  src:url("/fonts/GeistMono-Variable.woff2") format("woff2-variations"),
      url("/fonts/GeistMono-Variable.woff2") format("woff2");
  font-weight:100 900; font-style:normal; font-display:swap;
}
/* ------------------------------------------------------------------
   SQRlane, on the Geist design language: near-monochrome surfaces,
   hairline alpha borders, 6px radii, shadows you have to look for.
   Colour is spent only on state, never on decoration.
   ------------------------------------------------------------------ */
:root{
  --bg:#fafafa; --card:#fff; --card-muted:#fafafa; --sidebar:#fff;
  --fg:#171717; --muted:#4d4d4d; --faint:#8f8f8f;
  --border:#00000014; --border-strong:#00000024;
  --surface:#f2f2f2; --surface-2:#ebebeb;
  --blue:#006bff; --blue-bg:#e8f1ff;
  --green:#0f7b3f; --green-bg:#e7f5ec;
  --amber:#96580a; --amber-bg:#fdf3e3;
  --red:#ea001d;  --red-bg:#feecec;
  --r:6px;            /* controls and everyday surfaces */
  --r-md:12px;        /* cards - limns-admin's Card is rounded-[12px] */
  --shadow:0 2px 2px rgba(0,0,0,.04);
  --shadow-pop:0 1px 1px rgba(0,0,0,.02),0 4px 8px -4px rgba(0,0,0,.04),0 16px 24px -8px rgba(0,0,0,.06);
}
html[data-theme="dark"]{
  --bg:#000; --card:#0a0a0a; --card-muted:#111; --sidebar:#0a0a0a;
  --fg:#ededed; --muted:#a1a1a1; --faint:#7d7d7d;
  --border:#ffffff1f; --border-strong:#ffffff2e;
  --surface:#1a1a1a; --surface-2:#1f1f1f;
  --blue:#52a8ff; --blue-bg:#0d243f;
  --green:#3fcf68; --green-bg:#0d2618;
  --amber:#f5a623; --amber-bg:#2b1d05;
  --red:#ff5a5f;  --red-bg:#2d0d0f;
  --shadow:0 2px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 "Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit}
.shell{display:flex; height:100dvh; overflow:hidden}

/* ---------- sidebar collapse ---------- */
body.side-ready .side{transition:width .3s cubic-bezier(.175,.885,.32,1.1)}
body.side-collapsed .side{width:0; border-right-color:transparent}
body.side-collapsed .side > *{opacity:0; pointer-events:none}

/* ---------- sidebar ---------- */
.side{width:264px; flex:none; background:var(--sidebar); border-right:1px solid var(--border);
      display:flex; flex-direction:column; overflow:hidden}
.side-h{height:60px; display:flex; align-items:center; gap:10px; padding:0 16px}
.mark{width:26px;height:26px;border-radius:var(--r);background:var(--fg);flex:none;
      display:flex;align-items:center;justify-content:center}
.wordmark{font-size:15px;font-weight:600;letter-spacing:-.01em}
.tagline{font-size:11px;color:var(--faint);margin-top:-1px}
.nav{flex:1; overflow-y:auto; padding:6px 12px}
.nav-g{margin-bottom:16px}
.nav-t{display:flex; align-items:center; padding:0 10px 6px; font-size:12px; font-weight:500;
       letter-spacing:.05em; text-transform:uppercase; color:var(--faint)}
.nav-n{margin-left:auto; text-transform:none; letter-spacing:0; font-size:11px}
.nav-i{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
       padding:8px 10px; border:0; background:none; color:var(--muted);
       border-radius:var(--r); cursor:pointer; font-size:14px}
.nav-i + .nav-i{margin-top:2px}
.nav-i:hover{background:var(--surface); color:var(--fg)}
.nav-i.on{background:var(--surface); color:var(--fg); font-weight:500}
.nav-i svg{flex:none; opacity:.75}
.nav-i.on svg{opacity:1}
.nav-i .pill{margin-left:auto; font-size:12px; font-variant-numeric:tabular-nums;
             border:1px solid rgba(0,107,255,.35); background:rgba(0,107,255,.1); color:var(--blue);
             border-radius:999px; padding:0 7px; font-weight:500}
.nav-i .pill.quiet{border-color:transparent; background:var(--surface); color:var(--muted)}

/* The board, listed the way the reference lists projects: a state dot and a
   monospace id. The dot is the shipment's real state, so this is the board in
   miniature rather than decoration. */
.nav-s{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
       padding:6px 10px; border:0; background:none; color:var(--muted);
       border-radius:var(--r); cursor:pointer; font-size:13px}
.nav-s:hover{background:var(--surface); color:var(--fg)}
.nav-s.on{background:var(--surface); color:var(--fg)}
.sdot{width:6px; height:6px; border-radius:999px; flex:none; background:var(--green)}
.sdot.rerouted{background:var(--blue)}
.sdot.hold{background:var(--amber)}
.sid{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;flex:none}
.scargo{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--faint); font-size:12px}
.side-f{border-top:1px solid var(--border); padding:11px 14px}
.side-f .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.side-f code{display:block; margin-top:3px; font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:11px; color:var(--fg); overflow-wrap:anywhere}
.side-f .sub{font-size:11px;color:var(--faint);margin-top:3px}

/* ---------- main ---------- */
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.top{height:60px; flex:none; display:flex; align-items:center; gap:12px;
     padding:0 22px; border-bottom:1px solid var(--border); background:var(--card)}
.crumb{font-size:14px; font-weight:500}
.crumb span{color:var(--faint); font-weight:400}
.top .right{margin-left:auto; display:flex; align-items:center; gap:8px}
.icon-btn{width:32px;height:32px;border-radius:var(--r);border:1px solid transparent;
          background:none;color:var(--faint);cursor:pointer;display:flex;
          align-items:center;justify-content:center}
.icon-btn:hover{background:var(--surface);color:var(--fg)}
.run{background:var(--fg);color:var(--card);border:0;border-radius:var(--r);
     padding:8px 14px;font-size:13.5px;font-weight:500;cursor:pointer;
     display:flex;align-items:center;gap:8px}
.run:hover:not(:disabled){opacity:.88}
.run:disabled{opacity:.6;cursor:default}
.spin{width:12px;height:12px;border:1.8px solid rgba(128,128,128,.4);
      border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.scroll{flex:1; overflow-y:auto; padding:22px}
.view{display:none} .view.on{display:block}
.wrap{max-width:1180px; margin:0 auto}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
      box-shadow:var(--shadow)}
.card-h{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;
        align-items:center;gap:9px}
.card-h h2{margin:0;font-size:13px;font-weight:600}
.card-h .n{margin-left:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.chip{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
      padding:2px 6px;border-radius:4px;background:var(--surface);color:var(--muted)}
.chip.live{background:var(--green-bg);color:var(--green)}
.chip.synth{background:var(--amber-bg);color:var(--amber)}
/* Worn when a live read was attempted and nothing answered. Distinct from
   .synth, which marks authored data - a source that is down is not a fiction. */
.chip.off{background:var(--amber-bg);color:var(--amber)}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.red{background:var(--red-bg);color:var(--red)}
.sec-t{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
       color:var(--faint);margin:0 0 9px;display:flex;align-items:center;gap:8px}

/* stat row */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
      padding:20px;box-shadow:var(--shadow)}
/* Chart series colours. Both pairs were run through the palette validator
   against their own surface - the dark steps are chosen for the dark card, not
   flipped from the light ones. */
/* Series colours are their own tokens, not the UI's --blue/--amber/--green:
   those are tuned for text contrast, and reusing them put "Held" and "On plan"
   at deltaE 5.6 under deuteranopia - indistinguishable. Each set below was run
   through the palette validator against its own surface (lightness band, chroma
   floor, all-pairs CVD separation, normal-vision floor, contrast). The dark
   steps are chosen for the dark card, never flipped from the light ones. */
:root{
  --s-slack:#006bff;  --s-delay:#96580a;
  --s-reroute:#006bff; --s-hold:#96580a; --s-plan:#28a948;
}
html[data-theme="dark"]{
  --s-slack:#3d95f5;  --s-delay:#c8811a;
  --s-reroute:#3d95f5; --s-hold:#c8811a; --s-plan:#2ba455;
}

.grid-chart{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:20px;align-items:start}
@media(max-width:1000px){.grid-chart{grid-template-columns:1fr}}
.chart-card{padding:20px}
.chart-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.chart-h h2{font-size:16px;font-weight:600;letter-spacing:-.02em;margin:0}
.chart-h p{font-size:14px;color:var(--muted);margin:4px 0 0}
.chart-lg{display:flex;gap:14px;flex:none;padding-top:2px}
.chart-lg span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.chart-lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart-lg i.slack{background:var(--s-slack)}
.chart-lg i.delay{background:var(--s-delay)}
.chart{width:100%;height:auto;display:block;margin-top:14px;overflow:visible}
.chart .gl{stroke:var(--border);stroke-width:1}
.chart .axis{stroke:var(--border-strong);stroke-width:1}
.chart .ytick,.chart .xtick{fill:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
.chart .ytick{text-anchor:end}
.chart .xtick{text-anchor:middle;font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.chart .b.slack{fill:var(--s-slack)}
.chart .b.delay{fill:var(--s-delay)}
.chart .blab{text-anchor:middle;font-size:11px;font-weight:600;fill:var(--s-delay)}
.chart .grp:hover .b{opacity:.82}
.chart-f{font-size:12.5px;color:var(--faint);margin:12px 0 0}
.sl{display:flex;align-items:center;gap:16px}
.sl-t{display:flex;flex-direction:column;gap:4px}
.sl-t b{font-size:13.5px}
.sl-t span{font-size:12.5px;color:var(--muted);line-height:1.5}
.sl-t .sl-x{color:var(--red);font-weight:500}

.ap-g{margin-bottom:18px}
.ap-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ap-h b{font-size:14px}
.ap-c{font-size:12.5px;color:var(--muted)}

/* An event's consequences, on the event. These are the same data-pick buttons
   the sidebar uses, so clicking one selects the booking and opens the board. */
.ev-aff{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:11px;
        padding-top:11px;border-top:1px solid var(--border)}
.ev-aff .lbl{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;
             color:var(--faint);margin-right:3px}
.ev-aff.none{font-size:12.5px;color:var(--faint);display:block}
.aff-b{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
       background:var(--card);border-radius:var(--r);padding:3px 8px;cursor:pointer;
       font-size:12px;color:var(--fg)}
.aff-b:hover{border-color:var(--fg)}
.aff-b .aff-d{color:var(--faint)}

/* ---------- the approvals queue ----------
   Eighteen drafts rendered open ran 5,452px - five and a half screens to work a
   queue whose whole purpose is a person working it. A row states what the item
   is and what it changes; the body opens on demand. Same gate, same copy, one
   twentieth of the scrolling. */
.ap-rows{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;
         background:var(--card);box-shadow:var(--shadow)}
.ap-r+.ap-r{border-top:1px solid var(--border)}
.ap-rh{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;
       font-size:12.5px;min-width:0}
.ap-rh:hover{background:var(--surface)}
.ap-r.open .ap-rh{background:var(--surface)}
.ap-r.done .ap-t{color:var(--muted)}
.ap-ck{width:15px;height:15px;flex:none;border:1px solid var(--border-strong);
       border-radius:4px;background:var(--card);cursor:pointer;padding:0;
       display:flex;align-items:center;justify-content:center;color:transparent}
.ap-ck:hover{border-color:var(--fg)}
.ap-ck.on{background:var(--fg);border-color:var(--fg);color:var(--card)}
.ap-ck.done{border-color:transparent;background:none;color:var(--green);cursor:default}
.ap-ck svg{width:11px;height:11px}
.ap-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;
      max-width:44%}
.ap-sub{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        flex:1;min-width:0}
.ap-st{font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
       padding:2px 6px;border-radius:4px;flex:none}
.ap-st.awaiting{background:var(--amber-bg);color:var(--amber)}
.ap-st.approved{background:var(--green-bg);color:var(--green)}
.ap-x{color:var(--faint);flex:none;display:flex;transition:transform .12s ease}
.ap-r.open .ap-x{transform:rotate(90deg)}
.ap-rb{padding:0 12px 12px 12px;border-top:1px solid var(--border);background:var(--surface)}
.ap-rb .mail,.ap-rb .wb{margin-top:12px;background:var(--card)}
/* The bulk bar. It selects; it still never sends - the count is there so the
   person can see exactly how much they are signing off in one action. */
.ap-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.ap-bar .n{font-size:12.5px;color:var(--muted);margin-right:auto}
.ap-bar .n b{color:var(--fg)}
.ap-lnk{border:0;background:none;color:var(--blue);font-size:12.5px;cursor:pointer;padding:0}
.ap-lnk:hover{text-decoration:underline}
.approve.sm{padding:4px 9px;font-size:11.5px;flex:none}

/* ---------- element kit: segmented control, empty state, skeleton, gauge ---- */
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface);border-radius:var(--r);
     margin-bottom:16px}
.seg-b{display:flex;align-items:center;gap:7px;border:0;background:none;color:var(--muted);
       font:inherit;font-size:13px;padding:6px 12px;border-radius:4px;cursor:pointer}
.seg-b:hover{color:var(--fg)}
.seg-b.on{background:var(--card);color:var(--fg);font-weight:500;box-shadow:var(--shadow)}
.seg-n{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--faint);
       background:var(--card-muted);border-radius:999px;padding:0 6px}
.seg-b.on .seg-n{background:var(--surface);color:var(--muted)}

.empty-s{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
         padding:44px 24px;border:1px dashed var(--border-strong);border-radius:var(--r-md);
         background:var(--card)}
.empty-i{display:flex;align-items:center;justify-content:center;width:38px;height:38px;
         border-radius:999px;background:var(--surface);color:var(--faint);margin-bottom:4px}
.empty-t{font-size:14px;font-weight:600;margin:0}
.empty-b{font-size:13px;color:var(--muted);margin:0;max-width:46ch;line-height:1.55}

.sk-wrap{display:flex;flex-direction:column;gap:10px}
.sk-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
        border-radius:var(--r-md);padding:16px 18px}
.sk{display:block;border-radius:6px;background:linear-gradient(90deg,var(--surface) 25%,
    var(--surface-2) 37%,var(--surface) 63%);background-size:400% 100%;
    animation:sk 1.4s ease-in-out infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-dot{width:8px;height:8px;border-radius:999px;flex:none}
.sk-a{width:82px;height:11px;flex:none}
.sk-b{flex:1;height:11px;max-width:320px}
.sk-c{width:90px;height:11px;margin-left:auto;flex:none}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}

.ng{display:flex;justify-content:center}
.ng svg{width:120px;height:78px}
.ng-n{stroke:var(--surface-2);stroke-width:3.4;stroke-linecap:round}
.ng-n.on{stroke:var(--s-plan)}
.ng-n.on.warn{stroke:var(--s-hold)}
.ng-n.on.bad{stroke:var(--red)}
.ng-v{text-anchor:middle;font-size:19px;font-weight:600;fill:var(--fg);letter-spacing:-.03em}
.ng-l{text-anchor:middle;font-size:9.5px;fill:var(--faint)}

/* ---------- element kit: search, palette, page headers ---------- */
.sidesearch{display:flex;align-items:center;gap:9px;width:calc(100% - 24px);margin:2px 12px 8px;
            padding:8px 10px;border:1px solid var(--border);background:var(--card-muted);
            border-radius:var(--r);color:var(--faint);font-size:13.5px;cursor:pointer}
.sidesearch:hover{border-color:var(--border-strong);color:var(--muted)}
.sidesearch span{flex:1;text-align:left}
.sidesearch kbd,.pal-h kbd{font-family:inherit;font-size:10.5px;color:var(--faint);
     border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--card)}

.pal-scrim{position:fixed;inset:0;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;
           transition:opacity .15s;z-index:60}
.pal{position:fixed;top:14vh;left:50%;transform:translateX(-50%) scale(.98);width:min(560px,92vw);
     background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
     box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;
     z-index:61;overflow:hidden}
body.pal-on .pal-scrim,body.keys-on .pal-scrim{opacity:1;pointer-events:auto}
/* Both dialogs are .pal so they share the sheet's geometry and motion, but each
   is opened by its own body class - otherwise one body flag shows both at once. */
body.pal-on .pal:not(.kbd),
body.keys-on .pal.kbd{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.pal-h{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--border);
       color:var(--faint)}
.pal-h input{flex:1;border:0;background:none;outline:none;font:inherit;font-size:14.5px;color:var(--fg)}
.pal-h input::placeholder{color:var(--faint)}
.pal-l{max-height:340px;overflow-y:auto;padding:6px}
.pal-r{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;
       padding:9px 10px;border-radius:var(--r);cursor:pointer;color:var(--muted);font-size:13.5px}
.pal-r.on,.pal-r:hover{background:var(--surface);color:var(--fg)}
.pal-k{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
       border-radius:4px;padding:2px 6px;flex:none;background:var(--surface-2);color:var(--muted)}
.pal-r.on .pal-k.view{background:rgba(0,107,255,.12);color:var(--blue)}
.pal-t{font-weight:500;color:var(--fg);flex:none;
       font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.pal-hint{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.pal-empty{padding:22px 14px;text-align:center;color:var(--faint);font-size:13px}
.keys-l{padding:6px 14px 14px}
.keys-g{margin-top:10px}
.keys-t{font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
        color:var(--faint);margin:0 0 5px}
.keys-r{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:12.5px;color:var(--muted)}
.keys-r .d{flex:1}
.keys-r kbd{font-family:var(--mono);font-size:10.5px;background:var(--surface);
            border:1px solid var(--border);border-radius:4px;padding:2px 5px;color:var(--fg)}

/* Every page opens the same way: a title, a line saying what it is, and its
   actions on the right. */
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.page-h h1{font-size:20px;font-weight:600;letter-spacing:-.03em;margin:0;line-height:26px}
.page-h p{font-size:14px;color:var(--muted);margin:4px 0 0}
.page-a{display:flex;align-items:center;gap:8px;flex:none}
.stamp{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--faint)}
.stamp i{width:7px;height:7px;border-radius:999px;background:var(--green);display:inline-block}

/* The map. Sea and land are one step apart; the lanes carry all the contrast. */
.atlas{width:100%;height:auto;display:block;margin-top:16px;border-radius:var(--r-md);
       border:1px solid var(--border);background:var(--card-muted)}
.atlas .sea{fill:var(--card-muted)}
.atlas .land{fill:var(--surface);stroke:var(--border-strong);stroke-width:.6}
html[data-theme="dark"] .atlas .land{fill:#161616;stroke:#2a2a2a}
.atlas .lane{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;cursor:pointer}
.atlas .lane.reroute{stroke:var(--s-reroute)}
.atlas .lane.hold{stroke:var(--s-hold)}
.atlas .lane.plan{stroke:var(--s-plan)}
.atlas .lane.dim{stroke:var(--faint);opacity:.42;stroke-width:1.4}
.atlas .lane:hover{stroke-width:3.2}
.atlas .place circle{fill:var(--card);stroke:var(--muted);stroke-width:1.6}
.atlas .place.origin circle,.atlas .place.destination circle{fill:var(--muted);stroke:none}
.atlas .place.blocked circle{fill:var(--red);stroke:var(--card);stroke-width:2}
.atlas .place .halo{fill:var(--red);opacity:.16;stroke:none}
.atlas .place text{font-size:10px;fill:var(--muted);text-anchor:middle;pointer-events:none}
.atlas .place.blocked text{fill:var(--red);font-weight:600}
.maplegend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:12.5px;
           color:var(--muted)}
.maplegend span{display:flex;align-items:center;gap:7px}
.sw-lane{width:16px;height:3px;border-radius:2px;display:inline-block}
.sw-lane.reroute{background:var(--s-reroute)}
.sw-lane.hold{background:var(--s-hold)}
.sw-lane.plan{background:var(--s-plan)}
.sw-blocked{width:9px;height:9px;border-radius:999px;background:var(--red);display:inline-block}
.mapclear{margin-left:auto;font-size:12.5px;border:1px solid var(--border);background:var(--card);
          color:var(--fg);border-radius:var(--r);padding:4px 10px;cursor:pointer}
.mapkey{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:14px}
.mk{display:flex;align-items:center;gap:9px;text-align:left;background:var(--card);
    border:1px solid var(--border);border-radius:var(--r-md);padding:9px 11px;cursor:pointer;
    font-size:12.5px;color:var(--muted)}
.mk:hover{border-color:var(--border-strong)}
.mk.on{border-color:var(--fg)}
.mk-i{width:14px;height:3px;border-radius:2px;flex:none}
.mk.reroute .mk-i{background:var(--s-reroute)}
.mk.hold .mk-i{background:var(--s-hold)}
.mk.plan .mk-i{background:var(--s-plan)}
.mk-id{color:var(--fg);font-size:12px;flex:none}
.mk-r{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk-c{margin-left:auto;font-size:11px;color:var(--faint);flex:none}
.mk-h{background:var(--red-bg);color:var(--red);border-radius:999px;padding:1px 7px;font-size:11px;
      font-weight:600;flex:none}

/* The week, as a strip of days. Each bar is the day's decision mix, so the
   shape of the week is readable before any day is opened. */
.simstrip{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:20px}
@media(max-width:900px){.simstrip{grid-template-columns:repeat(4,1fr)}}
.simday{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;
        background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
        padding:11px 12px;cursor:pointer;box-shadow:var(--shadow)}
.simday:hover{border-color:var(--border-strong)}
.simday.on{border-color:var(--fg)}
.sd-l{font-size:13px;font-weight:600}
.sd-n{font-size:11.5px;color:var(--faint)}
.sd-bar{display:flex;gap:2px;width:100%;height:5px;margin-top:2px}
.sd-bar i{display:block;border-radius:2px;min-width:3px}
.sd-bar i.blue{background:var(--s-reroute)}
.sd-bar i.amber{background:var(--s-hold)}
.sd-bar i.green{background:var(--s-plan)}
.simev{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}

/* The connection point. */
.conn{padding:20px}
.conn-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.conn-h h2{font-size:16px;font-weight:600;letter-spacing:-.02em;margin:0}
.conn-h p{font-size:14px;color:var(--muted);margin:4px 0 0}
.conn-s{display:flex;align-items:center;gap:7px;flex:none;font-size:12.5px;font-weight:500;
        color:var(--green);background:var(--green-bg);border:1px solid rgba(15,123,63,.25);
        border-radius:999px;padding:3px 11px;white-space:nowrap}
.conn-s i{width:7px;height:7px;border-radius:999px;background:var(--green);display:inline-block}
.wb{border:1px solid var(--border);border-radius:var(--r-md);padding:12px 13px;margin-top:12px;
    background:var(--card-muted)}
.wb-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wb-b{display:grid;grid-template-columns:auto auto auto 1fr;gap:6px 10px;align-items:center;
      margin-top:10px;font-size:13px}
.wb-b .arr{color:var(--faint)}
.wb-b .now{font-weight:600}
.wb-f{color:var(--muted);font-size:12px}
.wb-b .was{color:var(--faint);text-decoration:line-through}
.wb-op{font-size:12px;color:var(--faint);margin-left:auto}
.wb .gate{margin:11px -13px -12px;border-radius:0 0 var(--r-md) var(--r-md)}
.wb-r{font-size:12.5px;color:var(--faint);margin-top:10px}

/* The bell only carries a dot when something is actually waiting. */
.icon-btn.bell{position:relative}
.icon-btn.bell .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:999px;
                    background:var(--blue);border:2px solid var(--card)}
.icon-btn.bell.has{color:var(--fg)}

/* Booking amendment, and the customs checklist. */
.amend{border:1px solid var(--border);border-radius:var(--r-md);padding:12px 13px;margin-top:12px;
       background:var(--card-muted)}
.amend-h{font-size:13px;font-weight:600;margin-bottom:8px}
.amend-r{display:flex;align-items:center;gap:10px;font-size:13.5px;flex-wrap:wrap}
.amend-r .was{color:var(--faint);text-decoration:line-through}
.amend-r .now{font-weight:600}
.amend-r .arr{color:var(--faint)}
.amend-a{font-size:12.5px;color:var(--muted);margin-top:6px}
.ck{list-style:none;margin:12px 0 0;padding:0}
.ck li{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;
       border-bottom:1px solid var(--border);color:var(--muted)}
.ck li:last-child{border-bottom:0}
.ck li::before{content:"";width:6px;height:6px;border-radius:999px;flex:none;background:var(--green)}
.ck li.todo::before{background:var(--amber)}
.ck li .at{margin-left:auto;font-size:12px;color:var(--faint)}
.ring-card{padding:20px}
.ring-h h2{font-size:16px;font-weight:600;letter-spacing:-.02em;margin:0}
.ring-h p{font-size:14px;color:var(--muted);margin:4px 0 0}
.ring-b{position:relative;display:flex;justify-content:center;margin:18px 0 4px}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;pointer-events:none}
.ring-c .rv{font-size:28px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring-c .rl{font-size:12px;color:var(--faint);margin-top:2px}
.ring-l{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.ring-l li{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.ring-l .k{display:flex;align-items:center;gap:8px;color:var(--muted)}
.ring-l .k i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.ring-l .v{font-weight:500;font-variant-numeric:tabular-nums}
.ring-l .pc{color:var(--faint);margin-left:8px;font-weight:400}
.stat-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.stat .lab{font-size:13px;font-weight:500;color:var(--muted)}
.spill{font-size:12px;font-weight:500;border-radius:999px;padding:1px 8px;white-space:nowrap;
       background:var(--surface);color:var(--muted);border:1px solid transparent}
.spill.blue{background:rgba(0,107,255,.1);color:var(--blue);border-color:rgba(0,107,255,.3)}
.spill.green{background:var(--green-bg);color:var(--green);border-color:rgba(15,123,63,.25)}
.spill.amber{background:var(--amber-bg);color:var(--amber);border-color:rgba(150,88,10,.25)}
.spill.red{background:var(--red-bg);color:var(--red);border-color:rgba(234,0,29,.25)}
/* heading-24 from the spec: 24px/600, -0.96px tracking, tabular figures. */
.stat .val{font-size:24px;font-weight:600;letter-spacing:-.04em;margin-top:12px;
           font-variant-numeric:tabular-nums;line-height:32px}
.stat .sub{font-size:12px;color:var(--faint);margin-top:8px}
.stat.act .val{color:var(--amber)}

.grid2{display:grid;grid-template-columns:1fr 336px;gap:20px;align-items:start}
@media(max-width:1080px){.grid2{grid-template-columns:1fr}}

/* ---------- shipment rows ---------- */
.rows{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.row{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
     box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;padding:13px 15px;
     cursor:pointer;text-align:left;width:100%;border-left:2px solid var(--border-strong);
     transition:border-color .35s}
.row:hover{background:var(--card-muted);border-color:var(--border-strong)}
.row.green{border-left-color:var(--green)}
.row.rerouted{border-left-color:var(--blue)}
.row.hold{border-left-color:var(--amber)}
.row.idle{cursor:default}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
       padding:3px 8px;border-radius:4px;white-space:nowrap;flex:none;min-width:78px;text-align:center}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.rerouted{background:var(--blue-bg);color:var(--blue)}
.badge.hold{background:var(--amber-bg);color:var(--amber)}
.who{flex:1;min-width:0}
.who .id{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.who .cargo{font-weight:500;font-size:14px;margin:1px 0}
.who .lane{font-size:12.5px;color:var(--muted)}
.hl{font-size:12.5px;color:var(--muted);max-width:270px;text-align:right}
.eta{text-align:right;flex:none;min-width:104px}
.eta .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
.eta .val{font-size:13px;font-variant-numeric:tabular-nums;font-weight:500}
.eta .was{text-decoration:line-through;color:var(--faint);font-weight:400;margin-right:5px}
.eta .breach{color:var(--red);font-size:11px;font-weight:500}
.fb{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    background:var(--amber-bg);color:var(--amber);border-radius:4px;padding:2px 5px;margin-left:7px}

/* ---------- scenario switcher ---------- */
.scen{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.scen-b{border:1px solid var(--border);background:var(--card);color:var(--muted);
        border-radius:var(--r);padding:7px 12px;cursor:pointer;font-size:13px;
        display:flex;flex-direction:column;gap:1px;text-align:left;min-width:150px}
.scen-b:hover{border-color:var(--border-strong);color:var(--fg)}
.scen-b.on{border-color:var(--fg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.scen-b .k{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.scen-b .nm{font-weight:500}
.scen-note{font-size:12.5px;color:var(--muted);margin:-2px 0 14px}
.scen-note b{color:var(--fg)}

/* ---------- worker roster strip ----------
   One row per Worker, not a card each. Thirteen 200px cards stacked three rows
   deep made this band ~400px tall, and the band sits above every view - so on a
   1280x720 laptop clicking a nav item changed two pixels of screen and the board
   looked broken. A pill keeps the two things that carry meaning, the state dot
   and the mode tag, and gives the view underneath the room it needs. */
.roster{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.wchip{border:1px solid var(--border);background:var(--card);border-radius:var(--r);
       padding:5px 9px;cursor:pointer;text-align:left;
       display:flex;align-items:center;gap:7px}
.wchip:hover{border-color:var(--border-strong)}
.wchip.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.wchip .nm{font-size:12.5px;font-weight:500;white-space:nowrap}
.wtag{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
      padding:1.5px 5px;border-radius:3px}
.wtag.live{background:var(--green-bg);color:var(--green)}
.wtag.scripted{background:var(--amber-bg);color:var(--amber)}
/* The link is neither live nor scripted: its write-backs are derived from the
   run, but no TMS is contacted. Its own tag, so neither word has to stretch. */
.wtag.demo{background:var(--blue-bg);color:var(--blue)}

/* ---------- worker panel band ---------- */
.wpanel{border:1px solid var(--border);background:var(--card);border-radius:var(--r-md);
        box-shadow:var(--shadow);margin-bottom:20px}
.wpanel-h{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;
          align-items:center;gap:9px;flex-wrap:wrap}
.wpanel-h b{font-size:13px}
.wpanel-b{padding:14px 15px}
.wpanel .ctx{font-size:12px;color:var(--faint);margin-left:auto}
table.q{width:100%;border-collapse:collapse;font-size:12.5px}
table.q th{text-align:left;font-weight:500;color:var(--faint);font-size:11px;
           text-transform:uppercase;letter-spacing:.05em;padding:0 10px 7px 0}
table.q td{padding:7px 10px 7px 0;border-top:1px solid var(--border);
           font-variant-numeric:tabular-nums}
table.q tr.pick td{background:var(--surface)}
.qtag{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
      padding:1.5px 5px;border-radius:3px;background:var(--blue-bg);color:var(--blue);margin-left:6px}
.qtag.cheap{background:var(--green-bg);color:var(--green)}
.ms{margin:0;padding:0 0 0 20px;list-style:none}
.ms li{position:relative;padding:6px 0;font-size:12.5px}
.ms li:before{content:"";position:absolute;left:-14px;top:12px;width:7px;height:7px;
              border-radius:50%;background:var(--border-strong)}
.ms li.done:before{background:var(--green)}
.ms li.dis:before{background:var(--amber)}
.ms li:after{content:"";position:absolute;left:-11px;top:19px;bottom:-6px;width:1px;background:var(--border)}
.ms li:last-child:after{display:none}
.ms .at{color:var(--faint);font-variant-numeric:tabular-nums;margin-left:8px;font-size:11.5px}
.fields{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:12.5px}
.fields .f{color:var(--faint)}
.qa{margin:0;padding:0;list-style:none}
.qa li{padding:9px 0;border-top:1px solid var(--border)}
.qa li:first-child{border-top:0;padding-top:0}
.qa .q{font-size:12.5px;font-weight:500}
.qa .a{font-size:12.5px;color:var(--muted);margin-top:3px}

/* ---------- workers ---------- */
.worker{padding:12px 15px;display:flex;gap:10px;align-items:flex-start}
.worker+.worker{border-top:1px solid var(--border)}
.wdot{width:7px;height:7px;border-radius:50%;background:var(--border-strong);flex:none;margin-top:6px}
.worker.working .wdot{background:var(--blue);animation:pulse 1s ease-in-out infinite}
.worker.done .wdot{background:var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.wname{font-size:13px;font-weight:500;display:flex;align-items:baseline;gap:7px}
.wsecs{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.wrole{font-size:11.5px;color:var(--faint);margin-top:2px;line-height:1.45}
.wsum{font-size:12.5px;margin-top:6px}
.wdet{margin:3px 0 0;padding:0;list-style:none}
.wdet li{font-size:11.5px;color:var(--muted);padding-left:9px;position:relative}
.wdet li:before{content:"·";position:absolute;left:1px}

/* ---------- risk feed ---------- */
.event{padding:13px 15px}
.event+.event{border-top:1px solid var(--border)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.tag{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
     padding:2px 6px;border-radius:4px;background:var(--surface);color:var(--muted)}
.tag.livesrc{background:var(--green-bg);color:var(--green)}
.tag.inj{background:var(--amber-bg);color:var(--amber)}
.tag.high{background:var(--red-bg);color:var(--red)}
.tag.lang{background:var(--blue-bg);color:var(--blue)}
.ev-title{font-size:13.5px;font-weight:500;line-height:1.45}
.ltrail{margin-top:9px;border-top:1px solid var(--border);padding-top:9px}
.ltrail-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);
          margin-bottom:6px}
.lt{display:flex;align-items:center;gap:8px;padding:2.5px 0;font-size:11.5px;color:var(--muted)}
.lt .lg{font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:1.5px 5px;border-radius:3px;
        background:var(--surface);color:var(--muted);min-width:26px;text-align:center}
.lt.first .lg{background:var(--blue-bg);color:var(--blue)}
.lt.wire .lg{background:var(--surface-2);color:var(--faint)}
.lt .off{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--faint);font-size:11px}
.lt .src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead{margin-top:7px;font-size:11.5px;color:var(--blue);font-weight:500}
.orig[dir="rtl"]{direction:rtl;text-align:right}
.orig{margin-top:6px;padding:7px 9px;background:var(--surface);border-radius:4px;
      font-size:12.5px;color:var(--muted);font-style:italic}
.ev-src{margin-top:7px;font-size:11.5px;color:var(--faint)}
.ev-why{margin-top:6px;font-size:12.5px;color:var(--muted)}
.srcline{padding:11px 15px;border-top:1px solid var(--border);font-size:11.5px;color:var(--faint)}
.srcline .r{display:flex;gap:7px;padding:1px 0}
/* Which KINDS of source answered. Forty-odd rows is a wall; six families is a
   sentence, and the families are the claim - news, instruments, notices, rates. */
.fams{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.fam{display:inline-flex;align-items:baseline;gap:5px;padding:2px 7px;border-radius:var(--r);
     border:1px solid var(--border);background:var(--surface);font-size:11px;color:var(--muted)}
.fam b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
.fam.ctx{opacity:.62}
/* Instrument readings and board context. Deliberately quieter than an event:
   promoting a number to look like an alarm is the one lie this board must not tell. */
.ctxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;padding:14px 15px}
.ctxi{border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;background:var(--surface)}
.ctxi .k{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.ctxi .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px}
.ctxi .s{font-size:11.5px;color:var(--muted);margin-top:1px}
/* A reading that crossed its threshold is also an event in the feed above, so
   it is marked here rather than sitting silently among the quiet ones. */
.ctxi.hot{border-color:var(--amber);background:var(--amber-bg)}
.ctxi.hot .v{color:var(--amber)}
.empty{padding:30px 16px;text-align:center;color:var(--faint);font-size:13px}

/* ---------- slide-over detail ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;
       transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:660px;max-width:94vw;background:var(--card);
       border-left:1px solid var(--border);box-shadow:var(--shadow-pop);z-index:50;
       transform:translateX(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);
       display:flex;flex-direction:column}
.panel.on{transform:none}
.panel-h{flex:none;padding:16px 20px;border-bottom:1px solid var(--border);
         display:flex;align-items:flex-start;gap:12px}
.panel-b{flex:1;overflow-y:auto;padding:20px}
.sec{margin-bottom:22px}
.sec:last-child{margin-bottom:0}
.reason{font-size:14px;line-height:1.62}
.rejected{margin:10px 0 0;padding:0;list-style:none}
.rejected li{font-size:12.5px;color:var(--muted);padding:4px 0 4px 15px;position:relative}
.rejected li:before{content:"×";position:absolute;left:0;color:var(--faint)}
.rejected b{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--fg)}
.record{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.record-h{background:var(--card-muted);padding:9px 13px;border-bottom:1px solid var(--border);
          font-size:11.5px;color:var(--faint);display:flex;gap:10px;flex-wrap:wrap}
.trail{margin:0;padding:12px 13px 13px 28px;list-style:none}
.trail li{position:relative;padding:5px 0;font-size:12.5px;color:var(--muted)}
.trail li:before{content:"";position:absolute;left:-17px;top:11px;width:6px;height:6px;
                 border-radius:50%;background:var(--border-strong)}
.trail li:after{content:"";position:absolute;left:-14.5px;top:18px;bottom:-5px;width:1px;
                background:var(--border)}
.trail li:last-child:after{display:none}
.trail li:last-child:before{background:var(--blue)}
.trail .k{color:var(--fg);font-weight:500}

/* ---------- drafts + approval ---------- */
.mail{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:10px}
.mail-h{background:var(--card-muted);padding:10px 13px;border-bottom:1px solid var(--border);font-size:12px}
.mail-h .to{font-weight:500}
.mail-h .subj{color:var(--muted);margin-top:2px}
.mail-b{padding:13px;font-size:12.5px;line-height:1.65;white-space:pre-wrap;
        font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;max-height:300px;overflow:auto}
.gate{display:flex;align-items:center;gap:10px;padding:10px 13px;border-top:1px solid var(--border);
      background:var(--card-muted);flex-wrap:wrap}
.gate-s{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
        padding:3px 8px;border-radius:4px}
.gate-s.awaiting{background:var(--amber-bg);color:var(--amber)}
.gate-s.approved{background:var(--green-bg);color:var(--green)}
.pnote{font-size:12px;color:var(--faint);margin:0 0 12px;line-height:1.5}
.inb{border:1px solid var(--border);border-radius:var(--r-md);padding:12px 13px;margin-bottom:10px}
.inb-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.inb-h .who{font-size:12.5px;font-weight:500;color:var(--fg)}
.inb-h .ago{margin-left:auto;font-size:11px;color:var(--faint)}
.inb-s{font-size:13px;font-weight:500;margin-bottom:5px}
.inb-b{font-size:12.5px;color:var(--muted);line-height:1.55}
.inb-r{margin-top:10px;padding:10px 11px;background:var(--card-muted);border-radius:var(--r);
  font-size:12.5px;line-height:1.55;color:var(--fg)}
.inb-rl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);
  margin-bottom:5px}
.approve{background:var(--fg);color:var(--card);border:0;border-radius:var(--r);
         padding:6px 13px;font-size:12.5px;font-weight:500;cursor:pointer}
.approve:hover{opacity:.88}
.gate .never{margin-left:auto;font-size:11px;color:var(--faint)}
.warn{margin-top:9px;font-size:12px;color:var(--amber);background:var(--amber-bg);
      border-radius:4px;padding:7px 10px}

/* The systems the connector is built to point at. A grid rather than the
   landing page's sliding band: this is a working view, and a marquee in an ops
   tool is motion for its own sake. The names and the disclaimer are the same. */
.syslist{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media(max-width:1100px){.syslist{grid-template-columns:repeat(2,1fr)}}
.sys{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--border);
     border-radius:var(--r);background:var(--card-muted);min-width:0}
.sys .nm{font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;
         overflow:hidden;text-overflow:ellipsis}
.sys .sysmk{width:18px;height:18px;flex:none;color:var(--faint);fill:none;stroke:currentColor;
         stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sys .kind{margin-left:auto;flex:none;font-size:9px;font-weight:600;letter-spacing:.04em;
           text-transform:uppercase;color:var(--faint);border:1px solid var(--border-strong);
           border-radius:3px;padding:0 4px;line-height:14px}
.sysprite{position:absolute;width:0;height:0;overflow:hidden}
.note{background:var(--amber-bg);border:1px solid var(--border);color:var(--amber);
      border-radius:var(--r);padding:10px 13px;font-size:12.5px;margin-bottom:8px}
.hint{border:1px dashed var(--border-strong);border-radius:var(--r);padding:14px 16px;
      font-size:13px;color:var(--muted);background:var(--card)}
.hint b{color:var(--fg)}
.keys{display:flex;gap:20px;flex-wrap:wrap}
.key{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--muted)}
.sw{width:10px;height:10px;border-radius:3px;flex:none;margin-top:3px}
.sw.live{background:var(--green-bg);border:1.5px solid var(--green)}
.sw.synth{background:var(--amber-bg);border:1.5px solid var(--amber)}
.sw.draft{background:var(--surface);border:1.5px dashed var(--border-strong)}
.sw.tms{background:var(--blue-bg);border:1.5px solid var(--blue)}
.key b{color:var(--fg);font-weight:600}
.said{margin-top:11px;padding-top:11px;border-top:1px solid var(--border);
      font-size:13px;font-style:italic}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="side-h" href="/" title="Back to the SQRlane overview page"
       style="text-decoration:none;color:inherit">
      <div class="mark"><svg width="15" height="15" viewBox="0 0 20 20" fill="none">
        <path d="M3.2 14h13.6M3.2 10h8.6M3.2 6h4.6" stroke="var(--card)" stroke-width="2.1" stroke-linecap="round"/></svg></div>
      <div><div class="wordmark">SQRlane</div><div class="tagline">Trade-lane risk, decided</div></div>
    </a>
    <button class="sidesearch" id="sidesearch" title="Search  Ctrl-K">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Search</span><kbd>Ctrl K</kbd>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="side-f">
      <span class="lab">Decision engine</span>
      <code id="eng-model">not yet resolved</code>
      <div class="sub" id="eng-split">resolves on the first run</div>
    </div>
  </aside>

  <div class="main">
    <div class="top">
      <button class="icon-btn" id="collapse" title="Toggle sidebar  ⌘B"
              aria-label="Toggle sidebar"></button>
      <div class="crumb"><span>SQRlane</span> / <span id="crumb">Overview</span></div>
      <div class="right">
        <button class="icon-btn bell" id="bell" title="Drafts awaiting your approval"
                aria-label="Drafts awaiting your approval"></button>
        <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme"></button>
        <button class="run" id="run"><span id="run-t">Inject Hamburg strike</span></button>
      </div>
    </div>
    <div class="scroll" id="scroll">
      <div class="wrap">
        <div id="band"></div>
        <div class="view on" id="v-overview"></div>
        <div class="view" id="v-shipments"></div>
        <div class="view" id="v-risk"></div>
        <div class="view" id="v-approvals"></div>
        <div class="view" id="v-connections"></div>
        <div class="view" id="v-simulation"></div>
        <div class="view" id="v-map"></div>
      </div>
    </div>
  </div>
</div>

<div class="pal-scrim" id="pal-scrim"></div>
<div class="pal kbd" id="keys" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
  <div class="pal-h"><b style="flex:1;font-size:13.5px">Keyboard shortcuts</b><kbd>Esc</kbd></div>
  <div class="keys-l" id="keys-l"></div>
</div>
<div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="Search">
  <div class="pal-h">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="pal-q" placeholder="Jump to a view or a booking…" autocomplete="off" spellcheck="false">
    <kbd>Esc</kbd>
  </div>
  <div class="pal-l" id="pal-l"></div>
</div>

<!-- Marks for the systems the connector is built to point at. Plain pictograms
     of what each KIND of system is - a container, a gantry, a ship, a shield -
     never a reproduction of anyone's logo. Same convention, and the same set,
     as the landing page's band. -->
<svg class="sysprite" aria-hidden="true" focusable="false"><defs>
  <symbol id="tms-container" viewBox="0 0 24 24">
    <rect x="2.8" y="7.4" width="18.4" height="9.2" rx="1.2"/>
    <path d="M8.2 7.4v9.2M12 7.4v9.2M15.8 7.4v9.2"/>
  </symbol>
  <symbol id="tms-scope" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="7.4"/>
    <path d="M12 2.8v3.8M12 17.4v3.8M2.8 12h3.8M17.4 12h3.8"/>
    <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="tms-network" viewBox="0 0 24 24">
    <circle cx="12" cy="4.9" r="2"/><circle cx="5.3" cy="17.4" r="2"/>
    <circle cx="18.7" cy="17.4" r="2"/>
    <path d="M11 6.7 6.3 15.6M13 6.7l4.7 8.9M7.3 17.4h9.4"/>
  </symbol>
  <symbol id="tms-truck" viewBox="0 0 24 24">
    <path d="M2.8 6.8h11v9.6h-11z"/><path d="M13.8 10.2h3.7l3.7 3.9v2.3h-7.4"/>
    <circle cx="7" cy="18.3" r="1.7"/><circle cx="17.4" cy="18.3" r="1.7"/>
  </symbol>
  <symbol id="tms-exchange" viewBox="0 0 24 24">
    <path d="M3.4 8.9h14.2M14.1 5.3l3.5 3.6-3.5 3.6"/>
    <path d="M20.6 15.1H6.4M9.9 18.7l-3.5-3.6 3.5-3.6"/>
  </symbol>
  <symbol id="tms-shield" viewBox="0 0 24 24">
    <path d="M12 2.9 20 5.6v6.1c0 4.4-3.2 7.6-8 9.4-4.8-1.8-8-5-8-9.4V5.6Z"/>
    <path d="M8.7 11.9 11 14.3l4.5-4.7"/>
  </symbol>
  <symbol id="tms-crane" viewBox="0 0 24 24">
    <path d="M3.4 20.6h17.2"/><path d="M7.2 20.6V5.4h13.4"/><path d="M7.2 5.4H3.6"/>
    <path d="M14.8 5.4v4.9"/><rect x="12.4" y="10.3" width="4.9" height="3.4" rx=".8"/>
  </symbol>
  <symbol id="tms-ship" viewBox="0 0 24 24">
    <path d="M3.4 14.8h17.2l-2.6 5.2H6Z"/><path d="M7.8 14.8V9.6h8.4v5.2"/>
    <path d="M12 9.6V5.4"/>
  </symbol>
</defs></svg>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel"><div class="panel-h" id="panel-h"></div><div class="panel-b" id="panel-b"></div></aside>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LABEL = {green:"On plan", rerouted:"Rerouted", hold:"Hold"};
const ICON = {
  workers:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M2 19c0-2.8 2.2-5 5-5M12 19c0-2.8 2.2-5 5-5s5 2.2 5 5"/></svg>',
  overview:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  shipments:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7h13v10H3zM16 10h3l2 3v4h-5"/><circle cx="7" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>',
  risk:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l9 16H3z"/><path d="M12 9v4M12 16.5v.5"/></svg>',
  approvals:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16v11H4z"/><path d="M4 6l8 6 8-6"/></svg>',
  sun:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z"/></svg>',
  panelClose:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 4v16M17 9l-3 3 3 3"/></svg>',
  panelOpen:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 4v16M14 9l3 3-3 3"/></svg>',
  bell:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  map:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>',
  simulation:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>',
  connections:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0z"/><path d="M12 18v4"/></svg>',
  close:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 5"/></svg>',
};

let board=[], workers=[], risk={events:[],sources:[]}, ai=null, summary=null, notes=[], hasRun=false;
let scenarios=[], scenario=null, chosenScenario=null, openWorker=null, selected=null;
/* The system of record. Every booking on this board was read out of it, and
   every change the Workers decide is queued straight back into it (src/tms.py). */
let tmsLink = {};
let sim = {}, simDay = null, simBusy = false;   // the authored week (src/simulation.py)
let atlas = {}, mapPick = null;                 // the board on a map (src/geo.py)
let ranAt = null;                               // when the last run finished
const approved = new Set();     // approval is browser state only; nothing is transmitted
let running = false;            // a run is in flight - views show their skeleton
let view = "overview", openId = null;

/* ---------- theme ---------- */
function theme(next){
  const t = next || localStorage.getItem("sqr:theme") || "light";
  document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem("sqr:theme", t); }catch(e){}
  $("theme").innerHTML = t === "dark" ? ICON.sun : ICON.moon;
}
$("theme").onclick = () => theme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");

/* ---------- nav ---------- */
/* Everything waiting on a person. A drafted email and a queued TMS change are
   the same kind of thing - work the Workers finished that leaves the building -
   so they sit behind one gate and are counted together. */
function pending(){ return draftsPending() + writesPending(); }
function key(d){ return `${d.shipment_id}|${d.audience}`; }
function draftsPending(){ return board.flatMap(s=>s.drafts||[]).filter(d=>!approved.has(key(d))).length; }
function writesPending(){ return queuedWrites().filter(w=>!approved.has(wkey(w))).length; }
function queuedWrites(){ return tmsLink.writebacks || []; }
function wkey(w){ return `tms|${w.booking_ref}|${w.record}|${w.action}`; }
function attention(){ return board.filter(s=>s.state!=="green" && s.decision).length; }

/* Grouped nav, then the board itself as a list - the same shape the reference
   admin uses for its project list: a status dot and a monospace identifier. Here
   the dots are real state, so the sidebar doubles as the board at a glance. */
const NAV_GROUPS = [
  {title:"Overview", items:[{id:"overview", label:"Overview"}]},
  {title:"Operations", items:[
    {id:"shipments", label:"Shipments", count:() => board.length, quiet:true},
    {id:"risk",      label:"Risk feed", count:() => (risk.events||[]).length, quiet:true},
    {id:"approvals", label:"Approvals", count:() => pending()},
  ]},
  {title:"System", items:[
    {id:"map", label:"Map", count:() => (atlas.lanes||[]).length, quiet:true},
    {id:"simulation", label:"Simulation",
     count:() => (sim.days||[]).length, quiet:true},
    {id:"connections", label:"TMS link",
     count:() => (tmsLink.queued || 0), quiet:true},
  ]},
];

/* Sidebar collapse, as the reference does it: persisted, restored before
   transitions are enabled so a collapsed sidebar does not slide in on load, and
   toggled with the same keyboard shortcut. */
let sideCollapsed = false;

function paintCollapse(){
  document.body.classList.toggle("side-collapsed", sideCollapsed);
  $("collapse").innerHTML = sideCollapsed ? ICON.panelOpen : ICON.panelClose;
}

function toggleSide(){
  sideCollapsed = !sideCollapsed;
  try { localStorage.setItem("sqrlane:sidebar", sideCollapsed ? "1" : "0"); } catch (e) {}
  paintCollapse();
}

let collapseReady = false;

function initCollapse(){
  if (collapseReady) return;      // render() calls this; bind the listener once
  collapseReady = true;
  try { sideCollapsed = localStorage.getItem("sqrlane:sidebar") === "1"; } catch (e) {}
  paintCollapse();
  requestAnimationFrame(() => document.body.classList.add("side-ready"));
  $("collapse").onclick = toggleSide;
  addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === "b") {
      e.preventDefault(); toggleSide();
    }
  });
}

/* The bell carries the real pending-approval count. It is a dot only when there
   is something waiting - a permanent badge would be decoration. */
/* The connection point. Everything here comes from src/tms.py, which imports
   nothing but datetime - there is no client, no credential and no endpoint. The
   status says "connected (demo)" in every place it is surfaced, and a write-back
   is a described change that stays queued behind the same approval gate as an
   email. */
/* The authored week. The button runs one cycle; this runs eight, and carries
   state between them - a box rerouted on Tuesday is on the new route on
   Wednesday, and a held one pays a day for every day it waits. Every event is
   authored, so the whole view is tagged SCRIPTED. The decisions inside it are
   still made by the real advisor. */
const SIMTONE = {reroute:"blue", hold:"amber", "no-action":"green"};

/* The board on a map. Coastlines are inlined, lanes come from src/geo.py, and
   nothing here contacts a map service - no tiles, no key, no CDN.

   On-plan lanes are drawn thin and recessive; the actioned ones carry the colour.
   Painting all seven equally would make the two that matter impossible to find. */
const MAPTONE = {rerouted:"reroute", hold:"hold", green:"plan"};

function mapView(){
  const a = atlas || {};
  if (!(a.lanes||[]).length) return emptyState({
    icon:"map", title:"No lanes to draw yet",
    body:"The map builds from the board. Press <b>Run</b> and every booking appears on the lane it actually sails."});
  const f = a.frame || {width:1000, height:560};
  const pick = mapPick && a.lanes.find(l => l.id === mapPick);
  const shown = pick ? [pick] : a.lanes;
  const hit = Object.keys(a.blocked||{});

  const line = l => {
    const d = "M" + l.points.map(p => `${p[0]},${p[1]}`).join("L");
    const tone = MAPTONE[l.state] || "plan";
    const dim = !pick && l.state === "green";
    return `<path class="lane ${tone} ${dim?"dim":""} ${pick?"lit":""}" d="${d}"
       data-lane="${esc(l.id)}"><title>${esc(l.id)} · ${esc(l.cargo)} · ${
       esc(l.from)} to ${esc(l.to)} · ${esc(l.route_id)}</title></path>`;
  };

  const dot = p => {
    const blocked = !!p.blocked;
    const cls = blocked ? "blocked" : p.kind;
    const r = blocked ? 6 : (p.kind === "origin" || p.kind === "destination") ? 3 : 4.5;
    return `<g class="place ${cls}">
      ${blocked?`<circle class="halo" cx="${p.x}" cy="${p.y}" r="13"/>`:""}
      <circle cx="${p.x}" cy="${p.y}" r="${r}"/>
      <text x="${p.lx}" y="${p.ly}">${esc(p.name)}</text>

/* Command palette. The reference libraries ship this as a React dialog over a
   search index; the same shape in vanilla is an overlay, an input, and a list
   that is rebuilt per keystroke. It searches what the board actually holds -
   the views, and every booking by id, cargo, origin and destination - so it is
   a way to reach something rather than a decorative search box. */
let palOpen = false, palSel = 0, palRows = [];

/* One header shape for every page. Before this, some views opened with a card
   and some with a bare table, so moving between them felt like moving between
   two products. */
/* ---- element kit ---------------------------------------------------------
   Ported patterns, not code: both reference libraries are React + Tailwind and
   this page is one vanilla file with no build step. What is portable is the
   anatomy - a segmented control, an empty state that names the next action, a
   skeleton with the shape of what is loading, and a notch gauge. */

/* Segmented control. One row, one active segment, counts on the right. */
function segmented(items, activeId, attr){
  return `<div class="seg" role="tablist">${items.map(i => `
    <button class="seg-b ${i.id===activeId?"on":""}" role="tab" aria-selected="${i.id===activeId}"
            data-${attr}="${esc(i.id)}">${esc(i.label)}${
      i.n != null ? `<span class="seg-n">${i.n}</span>` : ""}</button>`).join("")}</div>`;
}

/* Empty states point at the next action rather than announcing emptiness. */
function emptyState({icon, title, body, action}){
  return `<div class="empty-s">
    <span class="empty-i">${ICON[icon] || ICON.overview}</span>
    <p class="empty-t">${esc(title)}</p>
    <p class="empty-b">${body}</p>
    ${action || ""}</div>`;
}

/* A skeleton is the shape of the thing that is coming, not a spinner - so the
   layout does not jump when the run lands. */
function skeletonRows(n){
  return `<div class="sk-wrap">${Array.from({length:n}, () => `
    <div class="sk-row"><span class="sk sk-dot"></span>
      <span class="sk sk-a"></span><span class="sk sk-b"></span>
      <span class="sk sk-c"></span></div>`).join("")}</div>`;
}

/* Notch gauge, after the reference library's: a track cut into notches, filled
   to a 0-100 level, with the figure in the middle. Used for slack consumed,
   which is a real proportion - the delay against the slack the booking had. */
function notchGauge(pct, label, tone){
  // The track tops out at 100, so the figure does too: a full arc labelled
  // "500%" reads as a bug. The exact days sit in the line beside it, so nothing
  // is lost by capping the headline.
  const N = 28, START = -220, END = 40, span = END - START;
  const lit = Math.round(Math.min(pct, 100) / 100 * N);
  const R = 46, cx = 60, cy = 58;
  const notches = Array.from({length:N}, (_, i) => {
    const a = (START + span * (i / (N - 1))) * Math.PI / 180;
    const x1 = cx + Math.cos(a) * (R - 9), y1 = cy + Math.sin(a) * (R - 9);
    const x2 = cx + Math.cos(a) * R,        y2 = cy + Math.sin(a) * R;
    return `<line class="ng-n ${i < lit ? "on " + (tone||"") : ""}"
       x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}"
       x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }).join("");
  return `<div class="ng">
    <svg viewBox="0 0 120 78" role="img" aria-label="${esc(label)}: ${Math.round(pct)} percent">
      ${notches}
      <text class="ng-v" x="${cx}" y="${cy - 2}">${pct > 100 ? "100%+" : Math.round(pct) + "%"}</text>
      <text class="ng-l" x="${cx}" y="${cy + 13}">${esc(label)}</text>
    </svg></div>`;
}

const PAGES = {
  overview:   ["Overview", "The board, the run, and what the Workers did with it"],
  shipments:  ["Shipments", "Every booking on the board, grouped by what it needs"],
  risk:       ["Risk feed", "Everything the desk read this run — news, gauges, weather, hazards, filings, rates"],
  approvals:  ["Approvals", "Drafted work waiting on a person. Nothing is sent"],
  map:        ["Map", "Lanes drawn through what they transit, and what is blocked"],
  simulation: ["Simulation", "An authored week, decided for real, day by day"],
  connections:["TMS link", "The system of record this board runs on — bookings in, every Worker's action back out"],
};

function pageHeader(id, actions){
  const [title, sub] = PAGES[id] || [id, ""];
  const when = hasRun && ranAt ? `<span class="stamp"><i></i>Last run ${esc(ranAt)}</span>` : "";
  return `<div class="page-h">
    <div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>
    <div class="page-a">${when}${actions || ""}</div>
  </div>`;
}

function palSource(){
  const views = [
    {id:"overview", label:"Overview", hint:"The board and the run"},
    {id:"shipments", label:"Shipments", hint:"Every booking, grouped by state"},
    {id:"risk", label:"Risk feed", hint:"Every source read this run"},
    {id:"approvals", label:"Approvals", hint:"Drafts waiting on a person"},
    {id:"map", label:"Map", hint:"Lanes, chokepoints and blockades"},
    {id:"simulation", label:"Simulation", hint:"The authored week, replayed"},
    {id:"connections", label:"TMS link", hint:"The system of record the board runs on"},
  ].map(v => ({...v, kind:"view", go:() => go(v.id)}));

  const ships = board.map(sh => ({
    kind:"booking", id:sh.id, label:sh.id,
    hint:`${sh.cargo} · ${sh.origin} → ${sh.final_destination}`,
    state:sh.state,
    go:() => { pick(sh.id); openPanel(sh.id); },
  }));
  return views.concat(ships);
}

function palFilter(q){
  q = (q||"").trim().toLowerCase();
  const all = palSource();
  if (!q) return all.slice(0, 9);
  return all.filter(r => (r.label + " " + r.hint).toLowerCase().includes(q)).slice(0, 9);
}

function palPaint(){
  const q = $("pal-q").value;
  palRows = palFilter(q);
  if (palSel >= palRows.length) palSel = Math.max(0, palRows.length - 1);
  $("pal-l").innerHTML = palRows.length ? palRows.map((r, i) => `
    <button class="pal-r ${i===palSel?"on":""}" data-pal="${i}">
      <span class="pal-k ${esc(r.kind)}">${r.kind === "view" ? "View" : "Booking"}</span>
      <span class="pal-t">${esc(r.label)}</span>
      <span class="pal-hint">${esc(r.hint)}</span>
      ${r.state ? `<span class="sdot ${esc(r.state)}"></span>` : ""}
    </button>`).join("")
    : `<div class="pal-empty">Nothing matches “${esc(q)}”.</div>`;
  document.querySelectorAll("[data-pal]").forEach(b =>
    b.onclick = () => palRun(Number(b.dataset.pal)));
}

function palRun(i){
  const row = palRows[i];
  if (!row) return;
  palToggle(false);
  row.go();
}

function palToggle(open){
  palOpen = open;
  document.body.classList.toggle("pal-on", open);
  if (open) { $("pal-q").value = ""; palSel = 0; palPaint(); $("pal-q").focus(); }
}

let paletteReady = false;

function initPalette(){
  if (paletteReady) return;       // same: one keydown listener, not one per render
  paletteReady = true;
  $("sidesearch").onclick = () => palToggle(true);
  $("pal-scrim").onclick = () => palToggle(false);
  $("pal-q").oninput = () => { palSel = 0; palPaint(); };
  addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault(); palToggle(!palOpen); return;
    }
    if (!palOpen) return;
    if (e.key === "Escape") { e.preventDefault(); palToggle(false); }
    else if (e.key === "ArrowDown") { e.preventDefault(); palSel = Math.min(palSel + 1, palRows.length - 1); palPaint(); }
    else if (e.key === "ArrowUp")   { e.preventDefault(); palSel = Math.max(palSel - 1, 0); palPaint(); }
    else if (e.key === "Enter")     { e.preventDefault(); palRun(palSel); }
  });
}

/* ---------- keyboard ----------
   g-then-key jumps between views, the way most developer dashboards bind it. A
   dashboard someone works a queue in should not need the mouse for the parts
   that repeat. Typing in a field is never a shortcut, and any modifier means the
   browser's own binding wins. */
const GO_KEYS = {o:"overview", s:"shipments", r:"risk", a:"approvals",
                 t:"connections", m:"map", w:"simulation"};
const KEY_SHEET = [
  {title:"Go to", rows:[
    ["g o","Overview"], ["g s","Shipments"], ["g r","Risk feed"], ["g a","Approvals"],
    ["g t","TMS link"], ["g m","Map"], ["g w","Simulation"]]},
  {title:"Actions", rows:[
    ["⌘K / /","Search views and bookings"], ["⌘B","Collapse the sidebar"],
    ["Enter","Run the selected scenario"], ["?","This sheet"], ["Esc","Close"]]},
];

let keysOpen = false, keysReady = false;

function keysToggle(on){
  keysOpen = on;
  document.body.classList.toggle("keys-on", on);
  if (on) $("keys-l").innerHTML = KEY_SHEET.map(g => `<div class="keys-g">
      <p class="keys-t">${esc(g.title)}</p>
      ${g.rows.map(([k,d])=>`<div class="keys-r"><span class="d">${esc(d)}</span>
        ${k.split(" ").map(x=>`<kbd>${esc(x)}</kbd>`).join("")}</div>`).join("")}
    </div>`).join("");
}

function typingIn(el){
  return !!el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable);
}

let gArmed = false, gTimer = null;
function disarmG(){ gArmed = false; clearTimeout(gTimer); }

function initKeys(){
  if (keysReady) return;             // render() calls this; bind the listener once
  keysReady = true;
  $("pal-scrim").addEventListener("click", () => { if (keysOpen) keysToggle(false); });
  addEventListener("keydown", e => {
    if (e.key === "Escape" && keysOpen) { e.preventDefault(); keysToggle(false); return; }
    if (typingIn(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (palOpen || keysOpen) return;  // whichever dialog is up owns the keyboard
    const k = e.key.toLowerCase();
    if (gArmed && GO_KEYS[k]) { e.preventDefault(); disarmG(); go(GO_KEYS[k]); return; }
    disarmG();
    if (k === "g")      { gArmed = true; gTimer = setTimeout(disarmG, 1200); }
    else if (e.key === "?") { e.preventDefault(); keysToggle(true); }
    else if (e.key === "/") { e.preventDefault(); palToggle(true); }
    else if (e.key === "Enter" && !running) { e.preventDefault(); run(); }
  });
}

function paintBell(){
  const n = pending();
  const b = $("bell");
  b.innerHTML = ICON.bell + (n ? `<span class="dot" aria-hidden="true"></span>` : "");
  b.title = n ? `${n} item${n===1?"":"s"} awaiting your approval` : "Nothing awaiting approval";
  b.setAttribute("aria-label", b.title);
  b.classList.toggle("has", !!n);
}

function renderNav(){
  const groups = NAV_GROUPS.map(g => `
    <div class="nav-g">
